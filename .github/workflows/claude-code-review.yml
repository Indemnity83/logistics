name: Claude Code Review

on:
  pull_request:
    branches: ['mc/**']
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    name: review (claude)
    runs-on: ubuntu-latest

    # Skip fork PRs: GitHub resolves secrets to an empty string for pull_request
    # runs from forks, so the action cannot authenticate and the check would fail
    # on every external contribution. Review those by commenting @claude, which
    # runs in the base repo and does get the secret.
    # Skip release-please and dependabot PRs: neither benefits from a code review,
    # and both would spend review budget that human-authored PRs need.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && !contains(github.event.pull_request.labels.*.name, 'autorelease: pending')
      && github.event.pull_request.user.login != 'dependabot[bot]'

    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1
          # Keep GITHUB_TOKEN out of .git/config: this job reads untrusted PR
          # diffs, and the action supplies its own git credentials anyway.
          persist-credentials: false

      - name: Review pull request
        uses: anthropics/claude-code-action@8251c103ac8c1d761882c86aba1412c7f583c844 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # Print the review to the run log too, so a run that posts nothing can
          # still be diagnosed without reading step timings.
          display_report: true
          # The plugin command's own pre-flight skips closed PRs, drafts, trivial
          # diffs, and PRs it has already reviewed.
          #
          # The trailing instruction overrides the command's step 6, which stops
          # without commenting when nothing clears its confidence threshold. That
          # made a clean review indistinguishable from a skipped one: both leave a
          # green check and an empty PR. This check gates merges, so "reviewed,
          # found nothing" has to be visible on the PR.
          prompt: >-
            /code-review:code-review
            ${{ github.repository }}/pull/${{ github.event.pull_request.number }}


            Always finish by commenting on the pull request, even when no issues
            clear the confidence threshold — in that case post the command's
            "No issues found" format. Never end the run silently.
