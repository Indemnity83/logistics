name: Claude Code Review

on:
  pull_request:
    branches: ['mc/**']
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    name: review (claude)
    runs-on: ubuntu-latest

    # Deliberately no job-level `if`: a job skipped that way never reports its check,
    # and `review (claude)` is a required context on mc/** — a PR that skipped it
    # would sit pending forever. The job always runs and always reports; the steps
    # below no-op instead. Same shape the check-code.yml suites use for their path
    # filters.
    env:
      # Fork PRs: GitHub resolves secrets to an empty string for pull_request runs
      # from forks, so the action cannot authenticate. Review those by commenting
      # @claude, which runs in the base repo and does get the secret.
      # release-please and dependabot PRs: neither benefits from a code review, and
      # both would spend review budget that human-authored PRs need.
      REVIEWABLE: >-
        ${{ github.event.pull_request.head.repo.full_name == github.repository
        && !contains(github.event.pull_request.labels.*.name, 'autorelease: pending')
        && github.event.pull_request.user.login != 'dependabot[bot]' }}

    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Skip review for fork, release, and dependabot pull requests
        if: env.REVIEWABLE != 'true'
        run: echo "Not a reviewable pull request; reporting success without reviewing."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        if: env.REVIEWABLE == 'true'
        with:
          fetch-depth: 1
          # Keep GITHUB_TOKEN out of .git/config: this job reads untrusted PR
          # diffs, and the action supplies its own git credentials anyway.
          persist-credentials: false

      - name: Review pull request
        if: env.REVIEWABLE == 'true'
        uses: anthropics/claude-code-action@8251c103ac8c1d761882c86aba1412c7f583c844 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # Print the review to the run log too, so a run that posts nothing can
          # still be diagnosed without reading step timings.
          display_report: true
          # The plugin command's own pre-flight skips closed PRs, drafts, trivial
          # diffs, and PRs it has already reviewed.
          #
          # The trailing instruction overrides the command's step 6, which stops
          # without commenting when nothing clears its confidence threshold. That
          # made a clean review indistinguishable from a skipped one: both leave a
          # green check and an empty PR. This check gates merges, so "reviewed,
          # found nothing" has to be visible on the PR.
          prompt: >-
            /code-review:code-review
            ${{ github.repository }}/pull/${{ github.event.pull_request.number }}


            Always finish by commenting on the pull request, even when no issues
            clear the confidence threshold — in that case post the command's
            "No issues found" format. Never end the run silently.
