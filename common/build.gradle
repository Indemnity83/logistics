// Common subproject — shared domain code, compiles against vanilla MC via Loom.
// splitEnvironmentSourceSets() creates src/main (server-safe) and src/client (client-only).
//
// TODO(multiloader): swap net.fabricmc.fabric-loom here for net.neoforged.moddev.
//   MDG supports MC 26.1 (confirmed via MultiLoader-Template/tree/26.1). The blocker is
//   that common/ currently imports Fabric API directly (~25 classes across the codebase).
//   When ready:
//   - Replace the loom {} block with neoForge { neoFormVersion = neo_form_version }
//   - Remove Fabric API / fabric-loader dependencies (common should depend only on vanilla MC)
//   - Move FabricBlockEntityTypeBuilder usage out of LogisticsMod.java behind an abstraction
//     (vanilla BlockEntityType has a private constructor in MC 26.1; needs a loader helper)
//   - Apply multiloader-loader in neoforge/build.gradle to compile common sources there
//   See: https://github.com/jaredlll08/MultiLoader-Template/tree/26.1
plugins {
    id 'multiloader-common'
    id 'net.fabricmc.fabric-loom'
}

repositories {
    maven { url = "https://maven.terraformersmc.com/releases/" }
    maven { name = "Jared's maven"; url = "https://maven.blamejared.com/" }
}

loom {
    splitEnvironmentSourceSets()
    // No mods {} block — common is a compilation target, not a runnable mod.
    accessWidenerPath = file("src/main/resources/logistics.accesswidener")
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"

    testImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    // fabric-api is NOT on the main compile classpath — only test runtime needs it for the mixin
    // system (fabric-loader-junit initializes the Fabric environment which applies Fabric API mixins)
    testImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_version}"

    // Team Reborn Energy API (bundled into the Fabric jar via include in fabric/build.gradle)
    implementation("teamreborn:energy:${rootProject.fabric_energy_version}")

    // JEI — compile only; players install separately at runtime
    compileOnly("mezz.jei:jei-${rootProject.minecraft_version}-fabric:${rootProject.jei_version}")

    // Test infrastructure
    testImplementation "org.junit.jupiter:junit-jupiter:${rootProject.junit_version}"
    testImplementation "net.fabricmc:fabric-loader-junit:${rootProject.fabric_loader_version}"
    testImplementation "org.assertj:assertj-core:${rootProject.assertj_version}"
    // Fabric Loader 0.19.x pulls sponge-mixin 0.17.0 transitively here, which is missing
    // IAdviceProvider that mixinextras needs — the Fabric test launcher then fails to start.
    // Pin to the version Loom uses for the runnable subprojects so the headless env boots.
    testImplementation "net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7"
}

sourceSets {
    test {
        java { srcDir 'src/test/java' }
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = rootProject.java_version.toInteger()
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat = "full"
        showStandardStreams = false
    }
    failFast = false
    maxParallelForks = Runtime.runtime.availableProcessors().intdiv(2) ?: 1
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    inputs.property "archivesName", project.base.archivesName
    from("../LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}
