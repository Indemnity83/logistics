name: Notify Discord

# Posts a compact merge notification to #dev-log when a PR is merged.
# Skips release-please PRs.
# Skips draft PRs.
#
# Setup: add a DISCORD_DEVLOG_WEBHOOK_URL secret pointing to a webhook
# configured for the #dev-log channel.
on:
  pull_request:
    types: [closed]
  issues:
    types: [closed]

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions: {}
    if: |
      (github.event_name == 'issues') ||
      (github.event.pull_request.merged == true &&
       !github.event.pull_request.draft &&
       !startsWith(github.event.pull_request.title, 'chore: release'))

    steps:
      - name: Send Discord notification (PR merged)
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          DISCORD_DEVLOG_WEBHOOK_URL: ${{ secrets.DISCORD_DEVLOG_WEBHOOK_URL }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          if [[ -z "$DISCORD_DEVLOG_WEBHOOK_URL" ]]; then
            echo "DISCORD_DEVLOG_WEBHOOK_URL not set, skipping"
            exit 0
          fi

          SUMMARY=$(echo "$PR_BODY" | head -1 | cut -c1-150)

          DESCRIPTION="Merged into \`${BASE_BRANCH}\` by **${PR_AUTHOR}**"
          if [[ -n "$SUMMARY" ]]; then
            DESCRIPTION="${DESCRIPTION}\n${SUMMARY}"
          fi

          PAYLOAD=$(jq -n \
            --arg title "#${PR_NUMBER} — ${PR_TITLE}" \
            --arg url "$PR_URL" \
            --arg description "$DESCRIPTION" \
            '{
              "allowed_mentions": {"parse": []},
              "embeds": [{
                "title": $title,
                "url": $url,
                "description": $description,
                "color": 5025616
              }]
            }')

          set +e
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --connect-timeout 5 \
            --max-time 15 \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_DEVLOG_WEBHOOK_URL")
          CURL_EXIT=$?
          set -e

          if [[ "$CURL_EXIT" -ne 0 ]]; then
            echo "Discord notification failed (curl exit $CURL_EXIT)"
          elif [[ "$STATUS" -ge 400 ]]; then
            echo "Discord notification failed (HTTP $STATUS)"
          else
            echo "Discord dev-log notification sent (HTTP $STATUS)"
          fi

      - name: Send Discord notification (issue closed)
        if: github.event_name == 'issues'
        shell: bash
        env:
          DISCORD_DEVLOG_WEBHOOK_URL: ${{ secrets.DISCORD_DEVLOG_WEBHOOK_URL }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_CLOSER: ${{ github.event.sender.login }}
          ISSUE_REASON: ${{ github.event.issue.state_reason }}
        run: |
          if [[ -z "$DISCORD_DEVLOG_WEBHOOK_URL" ]]; then
            echo "DISCORD_DEVLOG_WEBHOOK_URL not set, skipping"
            exit 0
          fi

          # Map state_reason to a readable label and color
          case "$ISSUE_REASON" in
            completed)  LABEL="resolved";   COLOR=5025616 ;;  # green
            not_planned) LABEL="won't fix"; COLOR=9807270 ;;  # grey
            *)           LABEL="closed";    COLOR=9807270 ;;
          esac

          PAYLOAD=$(jq -n \
            --arg title "#${ISSUE_NUMBER} — ${ISSUE_TITLE}" \
            --arg url "$ISSUE_URL" \
            --arg description "Closed as **${LABEL}** by **${ISSUE_CLOSER}**" \
            --argjson color "$COLOR" \
            '{
              "allowed_mentions": {"parse": []},
              "embeds": [{
                "title": $title,
                "url": $url,
                "description": $description,
                "color": $color
              }]
            }')

          set +e
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --connect-timeout 5 \
            --max-time 15 \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_DEVLOG_WEBHOOK_URL")
          CURL_EXIT=$?
          set -e

          if [[ "$CURL_EXIT" -ne 0 ]]; then
            echo "Discord notification failed (curl exit $CURL_EXIT)"
          elif [[ "$STATUS" -ge 400 ]]; then
            echo "Discord notification failed (HTTP $STATUS)"
          else
            echo "Discord dev-log notification sent (HTTP $STATUS)"
          fi
