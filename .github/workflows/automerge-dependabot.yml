name: Automerge Dependabot

on:
  workflow_run:
    workflows: [Check Code]
    types: [completed]

permissions:
  # actions: read is what lets the job read the triggering run's per-job step
  # conclusions, which is how it tells a real check from a skipped one.
  actions: read
  checks: read
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Merge Dependabot PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          # Must match the step name of the same marker steps in check-code.yml.
          # A job that ran this step compiled and tested nothing.
          SKIP_MARKER: SKIPPED (no code-affecting files changed)
        shell: bash
        run: |
          set -euo pipefail

          PR_JSON=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/$REPO/commits/$HEAD_SHA/pulls" \
            --jq '[.[] | select(.state == "open" and .user.login == "dependabot[bot]" and (.base.ref | startswith("mc/")) and .head.repo.full_name == .base.repo.full_name)][0]')

          if [[ -z "$PR_JSON" || "$PR_JSON" == "null" ]]; then
            echo "No open Dependabot PR for $HEAD_SHA targeting mc/*; skipping."
            exit 0
          fi

          PR_NUMBER=$(jq -r '.number' <<< "$PR_JSON")
          PR_TITLE=$(jq -r '.title' <<< "$PR_JSON")
          echo "Checking Dependabot PR #$PR_NUMBER: $PR_TITLE"

          # A Check Code job whose path filter turned it off still reports success --
          # branch protection cannot tell "compiled and tested" from "echoed a line".
          # Automerge can: ask the run which of its jobs announced the skip.
          JOBS_JSON=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100")

          UNVERIFIED=$(jq -r --arg marker "$SKIP_MARKER" '
            [.jobs[]
             | select(any(.steps[]?; .name == $marker and .conclusion == "success"))
             | .name] | unique | join(", ")' <<< "$JOBS_JSON")

          if [[ -n "$UNVERIFIED" ]]; then
            echo "::warning::Check Code passed without verifying anything in: $UNVERIFIED"
            echo "Refusing to auto-merge a change no Gradle job actually checked."
            exit 0
          fi

          lint_pr_success=false
          for _ in {1..30}; do
            LINT_CONCLUSION=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name == "lint (pr)")][0].conclusion // ""')

            if [[ "$LINT_CONCLUSION" == "success" ]]; then
              lint_pr_success=true
              break
            fi

            if [[ -n "$LINT_CONCLUSION" && "$LINT_CONCLUSION" != "null" && "$LINT_CONCLUSION" != "success" ]]; then
              echo "lint (pr) completed with conclusion: $LINT_CONCLUSION"
              exit 0
            fi

            echo "Waiting for lint (pr) to complete..."
            sleep 10
          done

          if [[ "$lint_pr_success" != "true" ]]; then
            echo "lint (pr) did not complete successfully; skipping auto-merge."
            exit 0
          fi

          # --match-head-commit pins the merge to the commit the checks above were
          # read for. The lint (pr) poll can take up to 300 s, and without this a
          # force-push landing in that window would merge an unverified head.
          gh pr merge "$PR_NUMBER" --repo "$REPO" --squash \
            --match-head-commit "$HEAD_SHA"
