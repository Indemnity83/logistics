# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Mod Properties
maven_group=com.logistics
archives_base_name=logistics

# Minecraft
minecraft_version=26.3-snapshot-7
minecraft_compatibility_versions=26.3,26.4
java_version=25

# Fabric
# check these on https://fabricmc.net/develop
fabric_loader_version=0.19.3
fabric_version=0.156.2+26.3
loom_version=1.17-SNAPSHOT
fabric_energy_version=5.0.0

# NeoForge
# Released versions: https://projects.neoforged.net/neoforged/neoforge
# JEI's NeoForge build requires >=26.2.0.3-beta, so stay at or above that.
neoforge_version=26.2.0.6-beta
neoforge_loader_version_range=[4,)
moddev_version=2.0.141

# Dependencies
# Configory config library (bundled per loader; consumed from the Modrinth maven).
configory_version=0.2.0
# JEI is the one dependency whose *artifact id* embeds a Minecraft version
# (mezz.jei:jei-<mc>-fabric), so a version bump breaks resolution until JEI publishes for the new
# release — which can be weeks, and leaves the branch unable to compile or test anything until then.
# jei_mc_version is that artifact's Minecraft line, kept separate from minecraft_version so a
# pre-release branch can compile against the last line JEI shipped for. The API we use is stable
# across lines. Raise it to match minecraft_version once JEI catches up.
# Jade and spark need no equivalent: their Minecraft line lives in the version string below, so
# pointing them at an older build is just a version change.
jei_mc_version=26.2
jei_version=30.1.0.10
# Crash reporting (Sentry). sentry_version = runtime SDK (bundled per loader);
# sentry_gradle_version = the io.sentry.jvm.gradle source-context upload plugin.
sentry_version=8.43.0
sentry_gradle_version=5.8.0
jade_fabric_version=26.2.5+fabric
jade_neoforge_version=26.2.3+neoforge
spark_fabric_version=1.10.173-fabric
spark_neoforge_version=1.10.173-neoforge

# Test Dependencies
junit_version=5.11.0
assertj_version=3.26.0
