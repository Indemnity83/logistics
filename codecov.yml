codecov:
  notify:
    # CI still tests every module, but only common code uploads coverage.
    after_n_builds: 1

ignore:
  - "fabric/**"
  - "neoforge/**"
  - "common/src/client/**"

coverage:
  status:
    project:
      default:
        # Coverage is useful signal, but Minecraft world-bound code makes it a poor merge gate.
        informational: true
        target: auto
        threshold: 0.5%
    patch:
      default:
        informational: true
        target: 20%

flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: common

comment:
  layout: "reach, diff, flags, files"
  require_changes: true
  after_n_builds: 1
