// Fabric loader subproject.
// archivesName is overridden below to restore the original "logistics-${version}.jar" output,
// matching what CI workflows expect. The convention plugin default includes project.name and
// minecraft_version, which would produce "logistics-fabric-26.1-${version}.jar" instead.
plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
    id 'io.sentry.jvm.gradle'
}

version = System.getenv("MOD_VERSION") ?: "dev-fabric"

base {
    archivesName = rootProject.archives_base_name
}

repositories {
    // exclusiveContent, not content: `content` says a repo *serves* a group, but does not stop other
    // repos being probed for it. Maven Central (added by the loader plugins) was still asked for JEI
    // and Jade, which it has never hosted -- normally a harmless 404, but a 429 or timeout from
    // Central is a transport error, and Gradle fails the build instead of advancing to the next repo.
    // exclusiveContent makes these groups resolvable *only* here, so Central is never asked at all.
    // Both JEI mirrors stay in one block, BlameJared first, so failover survives a TerraformersMC outage.
    exclusiveContent {
        forRepositories(
            maven { name = "Jared's maven"; url = "https://maven.blamejared.com/" },
            maven { name = "TerraformersMC"; url = "https://maven.terraformersmc.com/releases/" }
        )
        filter {
            includeGroup "mezz.jei"
            includeGroup "com.terraformersmc"
        }
    }
    exclusiveContent {
        forRepository { maven { name = "Modrinth"; url = "https://api.modrinth.com/maven" } }
        filter { includeGroup "maven.modrinth" }
    }
}

loom {
    splitEnvironmentSourceSets()

    accessWidenerPath = project(':common').file("src/main/resources/logistics.accesswidener")

    mods {
        "logistics" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "logistics-gametest"
        enableGameTests = true
        eula = true
    }
}

// configureTests creates these run configs, so they can only be adjusted afterwards.
loom.runs.named('gameTest') {
    // Per-test results, so a failure names the test rather than only the run.
    property 'fabric-api.gametest.report-file',
            layout.buildDirectory.file('test-results/gameTest/report.xml').get().asFile.absolutePath
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_version}"

    testImplementation "org.junit.jupiter:junit-jupiter:${rootProject.junit_version}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "org.assertj:assertj-core:${rootProject.assertj_version}"

    // Team Reborn Energy API
    include("teamreborn:energy:${rootProject.fabric_energy_version}")
    implementation("teamreborn:energy:${rootProject.fabric_energy_version}")

    // Sentry SDK for opt-in crash reporting — bundled jar-in-jar so an opted-in user has it at runtime.
    include("io.sentry:sentry:${rootProject.sentry_version}")
    implementation("io.sentry:sentry:${rootProject.sentry_version}")

    // Configory config library — bundled jar-in-jar (it ships fabric.mod.json as a GAMELIBRARY).
    // Pinned to an exact version (see common/build.gradle).
    include("maven.modrinth:configory:${rootProject.configory_version}")
    implementation("maven.modrinth:configory:${rootProject.configory_version}")

    // JEI — compile against API only; players install separately at runtime
    compileOnly("mezz.jei:jei-${rootProject.jei_mc_version}-fabric:${rootProject.jei_version}")
    runtimeOnly("mezz.jei:jei-${rootProject.jei_mc_version}-fabric:${rootProject.jei_version}")

    // Jade HUD — compile against the API only; loaded in dev via runClient/runServer, never bundled.
    // Also on the main source set: fabric.mod.json entrypoints have no environment field, so Jade
    // resolves the "jade" entrypoint class on dedicated servers too.
    compileOnly("maven.modrinth:jade:${rootProject.jade_fabric_version}")
    runtimeOnly("maven.modrinth:jade:${rootProject.jade_fabric_version}")
    clientCompileOnly("maven.modrinth:jade:${rootProject.jade_fabric_version}")

    // Spark profiler (https://spark.lucko.me) — loaded in dev via runClient/runServer, never bundled.
    // If a future MC snapshot has no matching Spark build, comment this out until one ships.
    runtimeOnly("maven.modrinth:spark:${rootProject.spark_fabric_version}")
}

// Sentry source-context upload (so stack traces show inline source in Sentry). Gated on the
// SENTRY_AUTH_TOKEN secret: local/PR builds without it skip the upload entirely and never fail.
// We manage the SDK dependency ourselves above, so the plugin's auto-install/telemetry stay off.
def sentryAuthToken = System.getenv("SENTRY_AUTH_TOKEN")
sentry {
    includeSourceContext = sentryAuthToken != null && !sentryAuthToken.isEmpty()
    org = "indmenity83"
    projectName = "logistics-mod"
    authToken = sentryAuthToken
    autoInstallation {
        enabled = false
    }
    telemetry = false
}

// The Sentry plugin emits generated metadata into the main resources, which withSourcesJar() also
// picks up; declare the dependency so Gradle doesn't reject the implicit one on `build`.
tasks.named('sourcesJar') {
    dependsOn(tasks.matching {
        it.name.toLowerCase().startsWith('generatesentry') || it.name == 'collectExternalDependenciesForSentry'
    })
}

processResources {
    def compatibilityBounds = rootProject.minecraft_compatibility_versions.split(',').collect { it.trim() }
    if (compatibilityBounds.size() != 2 || compatibilityBounds.any { it.isEmpty() }) {
        throw new GradleException("minecraft_compatibility_versions must be formatted as '<min>,<next>'")
    }
    def fabricMinecraftVersionRange = ">=${compatibilityBounds[0]} <${compatibilityBounds[1]}"

    inputs.property "version", project.version
    inputs.property "minecraft_version", rootProject.minecraft_version
    inputs.property "fabric_minecraft_version_range", fabricMinecraftVersionRange
    inputs.property "fabric_version", rootProject.fabric_version
    inputs.property "fabric_loader_version", rootProject.fabric_loader_version
    inputs.property "java_version", rootProject.java_version
    filesMatching("fabric.mod.json") {
        expand inputs.properties
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat = "full"
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = rootProject.java_version.toInteger()
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    inputs.property "archivesName", project.base.archivesName
    from("../LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}
