plugins {
    id 'com.diffplug.spotless'
    id 'jacoco'
}

version = System.getenv("MOD_VERSION") ?: "dev"
group = project.maven_group

repositories {
    mavenCentral()
}

spotless {
    // Keep this intentionally minimal to avoid churny formatting diffs.
    // Whitespace hygiene for common text files.
    format('misc') {
        target '*.gradle', '**/*.gradle', '*.md', '*.yml', '*.yaml', '*.json', '*.properties', '.gitignore', '.git-town.toml'
        trimTrailingWhitespace()
        endWithNewline()
    }
}

subprojects { subproject ->
    apply plugin: 'com.diffplug.spotless'
    apply plugin: 'jacoco'

    spotless {
        java {
            target 'src/**/*.java'
            removeUnusedImports()
            trimTrailingWhitespace()
            endWithNewline()
        }
    }

    tasks.register('lint') {
        description = "Check ${subproject.path} source formatting"
        group = 'verification'
        dependsOn 'spotlessCheck'
    }

    tasks.register('fix') {
        description = "Apply ${subproject.path} source formatting"
        group = 'formatting'
        dependsOn 'spotlessApply'
    }

    plugins.withId('java') {
        tasks.named('jacocoTestReport', JacocoReport) {
            dependsOn tasks.withType(Test)
            reports {
                html.required = true
                xml.required = true
            }
        }

        subproject.afterEvaluate {
            tasks.named('jacocoTestReport', JacocoReport) {
                classDirectories.setFrom(files(coverageClassTrees(subproject)))
                sourceDirectories.setFrom(files(coverageSourceDirs(subproject)))
            }
        }
    }
}

def coverageIncludes(Project project) {
    project.name == 'common' ? ['com/logistics/**'] : ["com/logistics/${project.name}/**"]
}

def coverageSourceSets(Project project) {
    project.sourceSets.matching { it.name in ['main', 'client'] }
}

def coverageClassTrees(Project project) {
    def includes = coverageIncludes(project)
    coverageSourceSets(project).collectMany { sourceSet ->
        sourceSet.output.classesDirs.files.collect { dir ->
            fileTree(dir: dir, include: includes)
        }
    }
}

def coverageSourceDirs(Project project) {
    coverageSourceSets(project).collectMany { it.allSource.srcDirs }
}

tasks.register('checkImportBoundaries') {
    description = 'Check loader and domain import boundaries'
    group = 'verification'

    doLast {
        def failures = []
        def importMatches = { Object target, String pattern ->
            fileTree(target) {
                include '**/*.java'
            }.findAll { file ->
                file.readLines().any { line -> line ==~ pattern }
            }
        }

        importMatches('common/src', /^import (static )?net\.(fabricmc|neoforged)\..*/).each {
            failures << "loader import found in common/: ${rootDir.toPath().relativize(it.toPath())}"
        }

        importMatches('fabric/src', /^import (static )?net\.neoforged\..*/).each {
            failures << "neoforge import found in fabric/: ${rootDir.toPath().relativize(it.toPath())}"
        }

        importMatches('neoforge/src', /^import (static )?net\.fabricmc\..*/).each {
            failures << "fabric import found in neoforge/: ${rootDir.toPath().relativize(it.toPath())}"
        }

        def domains = ['pipe', 'power', 'automation']
        domains.each { domain ->
            def others = domains.findAll { it != domain }.join('|')
            importMatches("common/src/main/java/com/logistics/${domain}", /^import\s+(?:static\s+)?com\.logistics\.(${others})\..*/).each {
                failures << "cross-domain import found in ${domain}/: ${rootDir.toPath().relativize(it.toPath())}"
            }
        }

        // The raw Minecraft Identifier/ResourceLocation type may only be named in ResourceId.java;
        // everywhere else route through ResourceId / LogisticsMod.modId. A line that must name the
        // vanilla type at an external-API boundary (e.g. a JEI override signature) opts out with a
        // trailing "// raw-id-ok" marker. (\b skips our own toIdentifier()/ResourceId names.)
        ['common/src', 'fabric/src', 'neoforge/src'].each { srcRoot ->
            fileTree(srcRoot) {
                include '**/*.java'
                exclude '**/ResourceId.java'
                exclude '**/test/**'
            }.each { file ->
                file.eachLine { String line, int n ->
                    if (!line.contains('raw-id-ok') && (line =~ /\b(Identifier|ResourceLocation)\b/)) {
                        failures << "raw Identifier/ResourceLocation (use ResourceId): " +
                                "${rootDir.toPath().relativize(file.toPath())}:${n}"
                    }
                }
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException(failures.join(System.lineSeparator()))
        }
    }
}

tasks.register('lint') {
    description = 'Check all source and repository formatting'
    group = 'verification'
    dependsOn 'repoLint'
    dependsOn 'checkImportBoundaries'
    dependsOn 'checkFeatureTestParity'
    dependsOn 'checkResourceParity'
    dependsOn subprojects.collect { "${it.path}:lint" }
}

tasks.register('fix') {
    description = 'Apply all source and repository formatting'
    group = 'formatting'
    dependsOn 'repoFix'
    dependsOn subprojects.collect { "${it.path}:fix" }
}

tasks.register('repoLint') {
    description = 'Check repository-level formatting'
    group = 'verification'
    dependsOn 'spotlessMiscCheck'
}

tasks.register('repoFix') {
    description = 'Apply repository-level formatting'
    group = 'formatting'
    dependsOn 'spotlessMiscApply'
}

project(':common').tasks.named('lint') {
    dependsOn rootProject.tasks.named('repoLint')
    dependsOn rootProject.tasks.named('checkImportBoundaries')
    dependsOn rootProject.tasks.named('checkFeatureTestParity')
    dependsOn rootProject.tasks.named('checkResourceParity')
}

tasks.named('spotlessCheck') {
    dependsOn subprojects.collect { "${it.path}:spotlessCheck" }
}

tasks.named('spotlessApply') {
    dependsOn subprojects.collect { "${it.path}:spotlessApply" }
}

tasks.register('checkFeatureTestParity') {
    description = 'Check every shared feature test is wired on both loaders'
    group = 'verification'

    doLast {
        def javaFiles = { String dir -> fileTree(dir) { include '**/*.java' }.files.sort() }

        // The catalog is the shared bodies themselves: every public static method taking a
        // GameTestHelper is a test both loaders are expected to run.
        def catalog = [] as Set
        javaFiles('common/src/gametest').each { file ->
            (file.text =~ /public static [A-Za-z0-9_<>,.\[\] ]+?\s+(\w+)\s*\(\s*GameTestHelper/).each { m ->
                catalog << "${file.name - '.java'}#${m[1]}".toString()
            }
        }

        // Fabric: an @GameTest method either delegates to a shared body, or is unshared and must
        // say why — "loader-only:" for genuinely loader-native APIs, "not-yet-shared:" for a
        // tracked gap that should eventually move into common/src/gametest.
        def fabricShared = [] as Set
        def undocumented = []
        def notYetShared = []
        javaFiles('fabric/src/gametest').each { file ->
            def text = file.text
            (text =~ /@GameTest(?:\s*\([^)]*\))?\s+public\s+void\s+(\w+)\s*\(\s*GameTestHelper\s+\w+\s*\)\s*\{/).each { m ->
                def start = text.indexOf(m[0]) + m[0].length()
                def body = text.substring(start, Math.min(text.length(), start + 1500))
                def call = body =~ /(\w*GameTestBody)\.(\w+)\s*\(/
                def id = "${file.name - '.java'}#${m[1]}".toString()
                def marked = { String marker ->
                    text =~ /${marker}:[^\n]*\n(?:[^\n]*\n){0,12}?\s*public\s+void\s+${m[1]}\b/
                }
                if (call) {
                    fabricShared << "${call[0][1]}#${call[0][2]}".toString()
                } else if (marked('not-yet-shared')) {
                    notYetShared << id
                } else if (!marked('loader-only')) {
                    undocumented << id
                }
            }
        }

        // NeoForge: GameTestCase entries reference a body by method ref or inside a lambda.
        def neoShared = [] as Set
        javaFiles('neoforge/src/gametest').each { file ->
            def text = file.text
            (text =~ /new GameTestCase\(\s*"[^"]+"\s*,\s*\d+\s*,\s*[\w.]*?(\w+)::(\w+)\s*\)/).each { m ->
                neoShared << "${m[1]}#${m[2]}".toString()
            }
            (text =~ /(?s)new GameTestCase\(\s*"[^"]+"\s*,\s*\d+\s*,\s*\w+\s*->\s*\{(.{0,800}?)\n\s{0,12}\}\)/).each { m ->
                def call = m[1] =~ /(\w*GameTestBody)\.(\w+)\s*\(/
                if (call) neoShared << "${call[0][1]}#${call[0][2]}".toString()
            }
        }

        def failures = []
        (catalog - neoShared).sort().each {
            failures << "shared feature test not registered on NeoForge (add a GameTestCase): ${it}"
        }
        (catalog - fabricShared).sort().each {
            failures << "shared feature test not wrapped on Fabric (add an @GameTest method): ${it}"
        }
        (neoShared - catalog).sort().each {
            failures << "NeoForge registers an unknown body method: ${it}"
        }
        (fabricShared - catalog).sort().each {
            failures << "Fabric wraps an unknown body method: ${it}"
        }
        undocumented.sort().each {
            failures << "unshared feature test needs a '// loader-only: <reason>' or " +
                    "'// not-yet-shared: <reason>' comment: ${it}"
        }
        // Being wired is not the same as being discovered. A test class can be correctly written
        // and correctly registered in source, yet never run, because the step that makes the
        // runtime aware of it is missing. That failure is silent on both loaders — no error, no
        // log line, the test simply isn't in the count — so each discovery path is checked here.
        def bootstrapCalls = file('neoforge/src/gametest/java/com/logistics/gametest/LogisticsGameTestMod.java').text
        javaFiles('neoforge/src/gametest').each { file ->
            def name = file.name - '.java'
            if (name.endsWith('GameTestRegistration') && !bootstrapCalls.contains("${name}.bootstrap()")) {
                failures << "NeoForge registration never initialized (add ${name}.bootstrap() to " +
                        "LogisticsGameTestMod): ${name}"
            }
        }

        def modJson = file('fabric/src/gametest/resources/fabric.mod.json').text
        javaFiles('fabric/src/gametest').each { file ->
            def text = file.text
            def qualified = "${(text =~ /package ([\w.]+);/)[0][1]}.${file.name - '.java'}"
            def annotated = text =~ /@GameTest(?:\s*\([^)]*\))?\s+public\s+void\s+\w+\s*\(\s*GameTestHelper/
            def clientTest = text =~ /implements\s+FabricClientGameTest/
            if ((annotated || clientTest) && !modJson.contains("\"${qualified}\"")) {
                def entrypoint = clientTest ? 'fabric-client-gametest' : 'fabric-gametest'
                failures << "Fabric test class never discovered (add it to fabric.mod.json's " +
                        "${entrypoint} entrypoints): ${qualified}"
            }
        }

        // Deletion alarm: the catalog only ever grows in normal work.
        if (catalog.size() < 210) {
            failures << "shared feature-test catalog shrank to ${catalog.size()} (expected >= 210); " +
                    "if tests were deliberately removed, lower the floor in checkFeatureTestParity"
        }
        // Ratchet: the not-yet-shared backlog may shrink, never grow.
        if (notYetShared.size() > 0) {
            failures << "not-yet-shared feature tests grew to ${notYetShared.size()} (expected <= 0): " +
                    notYetShared.sort().join(', ')
        }

        if (!failures.isEmpty()) {
            throw new GradleException(failures.join(System.lineSeparator()))
        }
        logger.lifecycle("feature-test parity: ${catalog.size()} shared tests wired on both loaders; " +
                "${notYetShared.size()} Fabric tests not yet shared")
    }
}

tasks.register('checkResourceParity') {
    description = 'Check both loaders ship the same game content'
    group = 'verification'

    // Content that genuinely exists on one loader only, because the mechanism does. Fabric injects
    // worldgen and furnace fuels in code; NeoForge drives them from data. Keep this list specific —
    // a new entry means a player-visible difference between loaders unless the code compensates.
    def loaderOnly = [
        'neoforge': [
            'data/logistics/neoforge/': 'NeoForge biome modifiers; Fabric injects worldgen from code',
            'data/neoforge/'          : 'NeoForge data maps; Fabric registers the same values from code',
        ],
        'fabric'  : [:],
    ]

    doLast {
        // Only game content is compared. Mod manifests and META-INF/services are code wiring, and
        // the ServiceLoader smoke tests in each loader already cover those.
        def contentOf = { String module ->
            def found = [:]
            ['main', 'client'].each { sourceSet ->
                def root = file("${module}/src/${sourceSet}/resources")
                if (!root.isDirectory()) return
                fileTree(root).files.each { f ->
                    def id = root.toPath().relativize(f.toPath()).toString().replace(File.separator, '/')
                    if (id.startsWith('assets/') || id.startsWith('data/')) found[id] = f
                }
            }
            found
        }

        def common = contentOf('common')
        def fabric = contentOf('fabric')
        def neoforge = contentOf('neoforge')

        def excused = { String loader, String id ->
            loaderOnly[loader].keySet().any { id.startsWith(it) }
        }

        def failures = []
        def effective = { Map loaderFiles, String loader ->
            (common.keySet() + loaderFiles.keySet()).findAll { !excused(loader, it) } as Set
        }

        def onlyFabric = (effective(fabric, 'fabric') - effective(neoforge, 'neoforge')).sort()
        def onlyNeoForge = (effective(neoforge, 'neoforge') - effective(fabric, 'fabric')).sort()
        onlyFabric.each {
            failures << "content ships on Fabric but not NeoForge: ${it}"
        }
        onlyNeoForge.each {
            failures << "content ships on NeoForge but not Fabric: ${it}"
        }

        // A file duplicated identically in both loaders belongs in common: two copies drift, and
        // the loader that misses a fix is the one nobody notices.
        def duplicated = fabric.keySet().intersect(neoforge.keySet()).findAll { id ->
            !common.containsKey(id) && fabric[id].bytes == neoforge[id].bytes
        }.sort()
        if (!duplicated.isEmpty()) {
            failures << "identical files duplicated in both loaders: ${duplicated.size()} " +
                    "(expected none) — move these to common/src/main/resources instead: " + duplicated.join(', ')
        }

        if (!failures.isEmpty()) {
            throw new GradleException(failures.join(System.lineSeparator()))
        }
        logger.lifecycle("resource parity: ${effective(fabric, 'fabric').size()} content files on each loader; " +
                "no identical duplicates")
    }
}

// Named entry points for the test layers described in TESTING.md. These delegate to the
// underlying Gradle/plugin tasks; CI calls those directly to keep its per-module matrix.
tasks.register('unitTest') {
    description = 'Run all module unit tests (JUnit, no server)'
    group = 'verification'
    dependsOn subprojects.collect { "${it.path}:test" }
}

tasks.register('featureTestFabric') {
    description = 'Run Fabric feature tests (GameTest, real server)'
    group = 'verification'
    dependsOn ':fabric:runGameTest'
}

tasks.register('featureTestNeoForge') {
    description = 'Run NeoForge feature tests (GameTest, real server)'
    group = 'verification'
    dependsOn ':neoforge:runGameTestServer'
}

tasks.register('featureTest') {
    description = 'Run feature tests on every loader'
    group = 'verification'
    dependsOn 'featureTestFabric', 'featureTestNeoForge'
}

tasks.register('clientFeatureTestFabric') {
    description = 'Run Fabric client feature tests (real client, captures screenshots)'
    group = 'verification'
    dependsOn ':fabric:runClientGameTest'
}

tasks.register('testCoverage', JacocoReport) {
    description = 'Generate an aggregate unit test coverage report'
    group = 'verification'

    dependsOn subprojects.collect { "${it.path}:test" }
    executionData.from(subprojects.collect { it.layout.buildDirectory.file('jacoco/test.exec') })

    reports {
        html.required = true
        html.outputLocation = layout.buildDirectory.dir('reports/jacoco/testCoverage/html')
        xml.required = true
        xml.outputLocation = layout.buildDirectory.file('reports/jacoco/testCoverage/testCoverage.xml')
    }
}

gradle.projectsEvaluated {
    tasks.named('testCoverage', JacocoReport) {
        classDirectories.setFrom(files(subprojects.collectMany { coverageClassTrees(it) }))
        sourceDirectories.setFrom(files(subprojects.collectMany { coverageSourceDirs(it) }))
    }
}

// Task to install Git hooks for developers
tasks.register('installGitHooks') {
    description = 'Install Git hooks for code formatting'
    group = 'build setup'

    doLast {
        def hooksDir = file('.githooks')

        // Find the git hooks directory (handles worktrees)
        def gitDir = file('.git')
        def gitHooksDir

        if (gitDir.isFile()) {
            // This is a worktree - read the gitdir path
            def gitDirPath = gitDir.text.trim().replace('gitdir: ', '')
            // For worktrees, hooks are in the main repo's .git/hooks
            def worktreeGitDir = file(gitDirPath)
            // Navigate up to find the main .git directory
            def commonDir = new File(worktreeGitDir, 'commondir')
            if (commonDir.exists()) {
                def commonPath = commonDir.text.trim()
                gitHooksDir = file("${worktreeGitDir}/${commonPath}/hooks")
            } else {
                gitHooksDir = new File(worktreeGitDir, "hooks")
            }
        } else {
            // Regular git repository
            gitHooksDir = file('.git/hooks')
        }

        if (!gitHooksDir.exists()) {
            gitHooksDir.mkdirs()
        }

        println "Installing hooks to: ${gitHooksDir}"

        hooksDir.listFiles()?.each { hookFile ->
            if (hookFile.isFile()) {
                def targetFile = new File(gitHooksDir, hookFile.name)
                targetFile.text = hookFile.text
                targetFile.setExecutable(true)
                println "  ✓ Installed: ${hookFile.name}"
            }
        }
    }
}

// Aggregate build: delegates to loader subprojects.
tasks.named('build') {
    dependsOn ':fabric:build'
    dependsOn ':neoforge:build'
    dependsOn ':common:test'
    dependsOn ':common:apiJar'
}

tasks.named('check') {
    dependsOn 'lint'
}
