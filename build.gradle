plugins {
    id 'com.diffplug.spotless'
    id 'jacoco'
}

version = System.getenv("MOD_VERSION") ?: "dev"
group = project.maven_group

repositories {
    mavenCentral()
}

spotless {
    // Keep this intentionally minimal to avoid churny formatting diffs.
    // Whitespace hygiene for common text files.
    format('misc') {
        target '*.gradle', '**/*.gradle', '*.md', '*.yml', '*.yaml', '*.json', '*.properties', '.gitignore'
        trimTrailingWhitespace()
        endWithNewline()
    }
}

subprojects { subproject ->
    apply plugin: 'com.diffplug.spotless'
    apply plugin: 'jacoco'

    spotless {
        java {
            target 'src/**/*.java'
            removeUnusedImports()
            trimTrailingWhitespace()
            endWithNewline()
        }
    }

    tasks.register('lint') {
        description = "Check ${subproject.path} source formatting"
        group = 'verification'
        dependsOn 'spotlessCheck'
    }

    tasks.register('fix') {
        description = "Apply ${subproject.path} source formatting"
        group = 'formatting'
        dependsOn 'spotlessApply'
    }

    plugins.withId('java') {
        tasks.named('jacocoTestReport', JacocoReport) {
            dependsOn tasks.withType(Test)
            reports {
                html.required = true
                xml.required = true
            }
        }

        subproject.afterEvaluate {
            tasks.named('jacocoTestReport', JacocoReport) {
                classDirectories.setFrom(files(coverageClassTrees(subproject)))
                sourceDirectories.setFrom(files(coverageSourceDirs(subproject)))
            }
        }
    }
}

def coverageIncludes(Project project) {
    project.name == 'common' ? ['com/logistics/**'] : ["com/logistics/${project.name}/**"]
}

def coverageSourceSets(Project project) {
    project.sourceSets.matching { it.name in ['main', 'client'] }
}

def coverageClassTrees(Project project) {
    def includes = coverageIncludes(project)
    coverageSourceSets(project).collectMany { sourceSet ->
        sourceSet.output.classesDirs.files.collect { dir ->
            fileTree(dir: dir, include: includes)
        }
    }
}

def coverageSourceDirs(Project project) {
    coverageSourceSets(project).collectMany { it.allSource.srcDirs }
}

tasks.register('lint') {
    description = 'Check all source and repository formatting'
    group = 'verification'
    dependsOn 'repoLint'
    dependsOn subprojects.collect { "${it.path}:lint" }
}

tasks.register('fix') {
    description = 'Apply all source and repository formatting'
    group = 'formatting'
    dependsOn 'repoFix'
    dependsOn subprojects.collect { "${it.path}:fix" }
}

tasks.register('repoLint') {
    description = 'Check repository-level formatting'
    group = 'verification'
    dependsOn 'spotlessMiscCheck'
}

tasks.register('repoFix') {
    description = 'Apply repository-level formatting'
    group = 'formatting'
    dependsOn 'spotlessMiscApply'
}

tasks.named('spotlessCheck') {
    dependsOn subprojects.collect { "${it.path}:spotlessCheck" }
}

tasks.named('spotlessApply') {
    dependsOn subprojects.collect { "${it.path}:spotlessApply" }
}

tasks.register('testCoverage', JacocoReport) {
    description = 'Generate an aggregate unit test coverage report'
    group = 'verification'

    dependsOn subprojects.collect { "${it.path}:test" }
    executionData.from(subprojects.collect { it.layout.buildDirectory.file('jacoco/test.exec') })

    reports {
        html.required = true
        html.outputLocation = layout.buildDirectory.dir('reports/jacoco/testCoverage/html')
        xml.required = true
        xml.outputLocation = layout.buildDirectory.file('reports/jacoco/testCoverage/testCoverage.xml')
    }
}

gradle.projectsEvaluated {
    tasks.named('testCoverage', JacocoReport) {
        classDirectories.setFrom(files(subprojects.collectMany { coverageClassTrees(it) }))
        sourceDirectories.setFrom(files(subprojects.collectMany { coverageSourceDirs(it) }))
    }
}

// Task to install Git hooks for developers
tasks.register('installGitHooks') {
    description = 'Install Git hooks for code formatting'
    group = 'build setup'

    doLast {
        def hooksDir = file('.githooks')

        // Find the git hooks directory (handles worktrees)
        def gitDir = file('.git')
        def gitHooksDir

        if (gitDir.isFile()) {
            // This is a worktree - read the gitdir path
            def gitDirPath = gitDir.text.trim().replace('gitdir: ', '')
            // For worktrees, hooks are in the main repo's .git/hooks
            def worktreeGitDir = file(gitDirPath)
            // Navigate up to find the main .git directory
            def commonDir = new File(worktreeGitDir, 'commondir')
            if (commonDir.exists()) {
                def commonPath = commonDir.text.trim()
                gitHooksDir = file("${worktreeGitDir}/${commonPath}/hooks")
            } else {
                gitHooksDir = new File(worktreeGitDir, "hooks")
            }
        } else {
            // Regular git repository
            gitHooksDir = file('.git/hooks')
        }

        if (!gitHooksDir.exists()) {
            gitHooksDir.mkdirs()
        }

        println "Installing hooks to: ${gitHooksDir}"

        hooksDir.listFiles()?.each { hookFile ->
            if (hookFile.isFile()) {
                def targetFile = new File(gitHooksDir, hookFile.name)
                targetFile.text = hookFile.text
                targetFile.setExecutable(true)
                println "  ✓ Installed: ${hookFile.name}"
            }
        }
    }
}

// Aggregate build: delegates to loader subprojects.
tasks.named('build') {
    dependsOn ':fabric:build'
    dependsOn ':neoforge:build'
    dependsOn ':common:test'
}

tasks.named('check') {
    dependsOn 'lint'
}
