name: Build (Release)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g., mc1.21.11-v0.4.0) - will produce 0.4.0+mc1.21.11 version"
        required: true
        type: string
      publish:
        description: "Actually publish (otherwise build only)"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Non-secret boolean so the "Create Sentry release" step can gate on it (secrets can't be used in
    # `if`). The token itself is passed only to the steps that need it, never the whole job.
    env:
      HAS_SENTRY_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN != '' }}
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, neoforge]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
          # Full history so the Sentry release step (set_commits: auto) can
          # walk back to the previous release's commit; a shallow clone can't.
          fetch-depth: 0

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Extract version information
        id: version
        env:
          GH_EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          MATRIX_LOADER: ${{ matrix.loader }}
        run: |
          # Get tag name
          if [[ "$GH_EVENT" == "workflow_dispatch" ]]; then
            TAG="$INPUT_TAG"
          else
            TAG="$RELEASE_TAG"
          fi

          # Extract version from tag
          # Tag format: mc1.21.11-v0.4.0 (component-based for release-please tracking)
          if [[ "$TAG" =~ ^mc([0-9.]+)-v(.+)$ ]]; then
            VERSION="${BASH_REMATCH[2]}"        # "0.4.0" or "0.4.0-SNAPSHOT"
          else
            # Fallback for old/unexpected tag formats
            echo "⚠️  Tag didn't match expected format: $TAG"
            VERSION="${TAG#v}"
          fi

          # Ensure version doesn't have leading 'v' (strip it if present)
          VERSION="${VERSION#v}"

          # Extract MC version from gradle.properties
          MC_VERSION="$(grep '^minecraft_version=' gradle.properties | cut -d'=' -f2)"

          LOADER="$MATRIX_LOADER"

          # Build full version string with SemVer build metadata: VERSION+mcMC_VERSION.LOADER
          # Tag: mc1.21.11-v0.4.0 (for release-please tracking)
          # Version: 0.4.0+mc1.21.11.fabric (SemVer build metadata for artifacts)
          # The +mc1.21.11.fabric is SemVer build metadata - platform and loader identifiers
          FULL_VERSION="${VERSION}+mc${MC_VERSION}.${LOADER}"

          if [[ "$LOADER" == "fabric" ]]; then
            GRADLE_TASK=":${LOADER}:remapJar"
          else
            GRADLE_TASK=":${LOADER}:jar"
          fi

          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "full_version=$FULL_VERSION"
            echo "minecraft_version=$MC_VERSION"
            echo "loader=$LOADER"
            echo "gradle_task=$GRADLE_TASK"
          } >> "$GITHUB_OUTPUT"
          echo "📦 Tag: $TAG"
          echo "📦 Version: $VERSION"
          echo "📦 Built for MC: $MC_VERSION"
          echo "📦 Loader: $LOADER"
          echo "📦 Full version: $FULL_VERSION (will be passed to Gradle as MOD_VERSION)"
          echo "📦 Expected artifact: logistics-$FULL_VERSION.jar"
          echo "🔨 Gradle task: $GRADLE_TASK"

      - name: Build with Gradle
        run: ./gradlew ${{ steps.version.outputs.gradle_task }} --console=plain
        env:
          MOD_VERSION: ${{ steps.version.outputs.full_version }}
          # Enables Sentry source-context upload during the build. Withheld on dry-run dispatches so a
          # build-only run never uploads source context for a release that won't ship.
          SENTRY_AUTH_TOKEN: ${{ (github.event_name != 'workflow_dispatch' || inputs.publish) && secrets.SENTRY_AUTH_TOKEN || '' }}

      - name: Create Sentry release
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.publish) && env.HAS_SENTRY_TOKEN == 'true' }}
        uses: getsentry/action-release@ff07929a6537bac57790c3451cf4d364aca38528 # v3.7.0
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: indmenity83
          SENTRY_PROJECT: logistics-mod
        with:
          # Matches the runtime SDK's release: "logistics@" + modVersion (one per loader jar).
          release: logistics@${{ steps.version.outputs.full_version }}
          set_commits: auto
          # One Sentry project spans all four mc/* branches, so set_commits:auto's
          # previous release can live on a sibling branch whose commit isn't in this
          # branch's history. Degrade to default commit count instead of failing.
          ignore_missing: true
          finalize: true
          environment: production

      - name: List build artifacts
        run: |
          echo "📦 Build artifacts created:"
          ls -lh ${{ matrix.loader }}/build/libs/

      - name: Upload JAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: logistics-${{ matrix.loader }}-${{ steps.version.outputs.full_version }}
          path: ${{ matrix.loader }}/build/libs/logistics-${{ steps.version.outputs.full_version }}.jar

  publish:
    needs: build
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        loader: [fabric, neoforge]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Extract version information
        id: version
        env:
          GH_EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          MATRIX_LOADER: ${{ matrix.loader }}
        run: |
          # Get tag name
          if [[ "$GH_EVENT" == "workflow_dispatch" ]]; then
            TAG="$INPUT_TAG"
          else
            TAG="$RELEASE_TAG"
          fi

          # Extract version from tag
          if [[ "$TAG" =~ ^mc([0-9.]+)-v(.+)$ ]]; then
            VERSION="${BASH_REMATCH[2]}"
          else
            VERSION="${TAG#v}"
          fi

          VERSION="${VERSION#v}"

          MC_VERSION="$(grep '^minecraft_version=' gradle.properties | cut -d'=' -f2)"
          LOADER="$MATRIX_LOADER"

          FULL_VERSION="${VERSION}+mc${MC_VERSION}.${LOADER}"

          # Detect snapshot/alpha/beta versions for publishing configuration
          if [[ "$MC_VERSION" =~ (snapshot|alpha|beta) ]]; then
            VERSION_TYPE="beta"
            GAME_VERSION_FILTER="none"
            MODRINTH_FEATURED="false"
          else
            VERSION_TYPE="release"
            GAME_VERSION_FILTER="releases"
            MODRINTH_FEATURED="true"
          fi

          # Create potentially shortened version for Modrinth (32 char limit)
          MODRINTH_VERSION="${FULL_VERSION}"
          if (( ${#MODRINTH_VERSION} > 32 )); then
            MODRINTH_VERSION="${MODRINTH_VERSION:0:32}"
            echo "⚠️  Modrinth version truncated to 32 chars: $MODRINTH_VERSION"
          fi

          {
            echo "tag=$TAG"
            echo "modrinth_version=$MODRINTH_VERSION"
            echo "version=$VERSION"
            echo "full_version=$FULL_VERSION"
            echo "minecraft_version=$MC_VERSION"
            echo "loader=$LOADER"
            echo "version_type=$VERSION_TYPE"
            echo "game_version_filter=$GAME_VERSION_FILTER"
            echo "modrinth_featured=$MODRINTH_FEATURED"
          } >> "$GITHUB_OUTPUT"

      - name: Download JAR
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: logistics-${{ matrix.loader }}-${{ steps.version.outputs.full_version }}
          path: artifacts/

      - name: Publish to Modrinth and CurseForge
        uses: Kir-Antipov/mc-publish@995edadc13559a8b28d0b7e6571229f067ec7659 # v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: ${{ steps.version.outputs.modrinth_featured }}
          modrinth-version: ${{ steps.version.outputs.modrinth_version }}

          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ steps.version.outputs.tag }}

          game-version-filter: ${{ steps.version.outputs.game_version_filter }}
          version-type: ${{ steps.version.outputs.version_type }}
          name: "Logistics v${{ steps.version.outputs.version }} for ${{ steps.version.outputs.loader }} ${{ steps.version.outputs.minecraft_version }}"
          version: "${{ steps.version.outputs.full_version }}"

          files: artifacts/logistics-${{ steps.version.outputs.full_version }}.jar

          changelog: ${{ github.event.release.body || format('Release {0}', steps.version.outputs.full_version) }}
