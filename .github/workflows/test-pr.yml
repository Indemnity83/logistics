name: Test (PR)

on:
  pull_request:
    branches: ['mc/**']
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  repo-lint:
    # Skip: draft PRs, release-please PRs
    if: |
      github.event.pull_request.draft == false &&
      !startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Check repository formatting
        run: ./gradlew spotlessMiscCheck --console=plain

  module-lint:
    # Skip: draft PRs, release-please PRs
    if: |
      github.event.pull_request.draft == false &&
      !startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [common, fabric, neoforge]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Check ${{ matrix.module }} formatting
        run: ./gradlew :${{ matrix.module }}:lint --console=plain

  unit-tests:
    # Skip: draft PRs, release-please PRs
    if: |
      github.event.pull_request.draft == false &&
      !startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [common, fabric, neoforge]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Run ${{ matrix.module }} tests
        run: ./gradlew :${{ matrix.module }}:test --console=plain
        # Note: Game tests (./gradlew :fabric:runGameTest) are not run in CI due to resource
        # constraints and long execution time. Run locally before merging if testing game mechanics.

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.module }}-${{ github.run_id }}
          path: ${{ matrix.module }}/build/reports/tests/test/
