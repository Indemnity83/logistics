name: Check PR

on:
  pull_request:
    branches: ['mc/**']
    types: [opened, edited, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: lint (pr)
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'

    permissions:
      pull-requests: read

    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            perf
            test
            build
            ci
            chore
            revert

          scopes: |
            core
            automation
            pipes
            energy
            storage
            ui
            compat
            fabric
            neoforge
            docs
            release
            update
            common
            build
            fluids

          requireScope: true
          validateSingleCommit: false

          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            should start with a lowercase letter.

            Good:
              fix(pipes): prevent items from getting stuck
              feat(energy): add energy pipe support

            Bad:
              Fix(pipes): Prevent items from getting stuck
