// Common subproject — shared domain code, compiles against vanilla MC via Loom.
// splitEnvironmentSourceSets() creates src/main (server-safe) and src/client (client-only).
//
// TODO(multiloader): swap net.fabricmc.fabric-loom-remap here for net.neoforged.moddev.
//   The blocker is that common/ currently imports Fabric API directly (~25 classes across the codebase).
//   When ready:
//   - Replace the loom {} block with neoForge { neoFormVersion = neo_form_version }
//   - Remove Fabric API / fabric-loader dependencies (common should depend only on vanilla MC)
//   - Move FabricBlockEntityTypeBuilder usage out of LogisticsMod.java behind an abstraction
//   - Apply multiloader-loader in neoforge/build.gradle to compile common sources there
plugins {
    id 'multiloader-common'
    id 'net.fabricmc.fabric-loom-remap'
}

repositories {
    maven { url = "https://maven.terraformersmc.com/releases/" }
    maven { name = "Jared's maven"; url = "https://maven.blamejared.com/" }
}

loom {
    splitEnvironmentSourceSets()
    // No mods {} block — common is a compilation target, not a runnable mod.
    accessWidenerPath = file("src/main/resources/logistics.accesswidener")
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    // fabric-api is NOT on the main compile classpath. modRuntimeOnly (not testImplementation) is
    // required because 1.21.11 Fabric API uses intermediary mappings that Loom must remap to named;
    // plain testImplementation bypasses Loom remapping and causes a classTweaker namespace mismatch.
    modRuntimeOnly "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_version}"

    // Team Reborn Energy API (bundled into the Fabric jar via include in fabric/build.gradle)
    modImplementation("teamreborn:energy:${rootProject.fabric_energy_version}")

    // Sentry SDK for opt-in crash reporting (pure Java, no transitive deps). Bundled per loader
    // via include (Fabric) / jarJar (NeoForge); here it compiles common and runs the unit tests.
    implementation("io.sentry:sentry:${rootProject.sentry_version}")

    // JEI — compile only; players install separately at runtime
    modCompileOnly("mezz.jei:jei-${rootProject.minecraft_version}-fabric-api:${rootProject.jei_version}")

    // Test infrastructure
    testImplementation "org.junit.jupiter:junit-jupiter:${rootProject.junit_version}"
    testImplementation "net.fabricmc:fabric-loader-junit:${rootProject.fabric_loader_version}"
    testImplementation "org.assertj:assertj-core:${rootProject.assertj_version}"
}

sourceSets {
    test {
        java { srcDir 'src/test/java' }
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = rootProject.java_version.toInteger()
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat = "full"
        showStandardStreams = false
    }
    failFast = false
    maxParallelForks = Runtime.runtime.availableProcessors().intdiv(2) ?: 1
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    inputs.property "archivesName", project.base.archivesName
    from("../LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}

// ------------------------------------------------------------------------------------------------
// Loader-independent API jar — the cross-mod tank/fluid contract for downstream mods (e.g. irontanks).
//
// These packages are loader-agnostic and compile against Mojang official mappings (verified: public
// signatures use net.minecraft.world.level.Level, not intermediary class_*), so ONE jar serves both
// Fabric and NeoForge consumers. Consume it with plain `compileOnly` (NOT modCompileOnly, so Loom
// leaves it un-remapped) and guard use behind a mod-loaded check; the consumer's own remap carries
// call sites to its runtime mappings, matching the separately-installed logistics mod jar.
//
// Scope is the full transitive closure of the public contract — keep it minimal so internals stay
// off downstream classpaths.
def apiPackages = [
    'com/logistics/api/**',
    'com/logistics/core/lib/tank/**',
    'com/logistics/core/lib/fluids/**',
    'com/logistics/core/lib/compat/**',
    'com/logistics/core/lib/resource/**',
]

tasks.register('apiJar', Jar) {
    description = 'Loader-independent API jar for downstream mods to compile against.'
    group = 'build'
    archiveBaseName = "${rootProject.archives_base_name}-api"
    from(sourceSets.main.output) {
        include apiPackages
    }
    from("../LICENSE") {
        rename { "${it}_${rootProject.archives_base_name}-api" }
    }
}

tasks.named('assemble') {
    dependsOn 'apiJar'
}

publishing {
    publications {
        api(MavenPublication) {
            groupId = rootProject.maven_group
            artifactId = "${rootProject.archives_base_name}-api"
            version = project.version
            artifact tasks.named('apiJar')
        }
    }
}
