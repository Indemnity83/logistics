// NeoForge loader subproject.
plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
    id 'io.sentry.jvm.gradle'
}

version = System.getenv("MOD_VERSION") ?: "0.0.0-dev.neoforge"
group = rootProject.group

base {
    archivesName = rootProject.archives_base_name
}

repositories {
    // exclusiveContent, not content: `content` says a repo *serves* a group, but does not stop other
    // repos being probed for it. Maven Central (added by the loader plugins) was still asked for JEI
    // and Jade, which it has never hosted -- normally a harmless 404, but a 429 or timeout from
    // Central is a transport error, and Gradle fails the build instead of advancing to the next repo.
    // exclusiveContent makes these groups resolvable *only* here, so Central is never asked at all.
    // Both JEI mirrors stay in one block, BlameJared first, so failover survives a TerraformersMC outage.
    exclusiveContent {
        forRepositories(
            maven { name = "Jared's maven"; url = "https://maven.blamejared.com/" },
            maven { name = "TerraformersMC"; url = "https://maven.terraformersmc.com/releases/" }
        )
        filter {
            includeGroup "mezz.jei"
            includeGroup "com.terraformersmc"
        }
    }
    exclusiveContent {
        forRepository { maven { name = "Modrinth"; url = "https://api.modrinth.com/maven" } }
        filter { includeGroup "maven.modrinth" }
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(rootProject.java_version.toInteger())
    withSourcesJar()
}

// Integration tests using the vanilla/NeoForge GameTest framework. Kept as a separate source
// set (not `test`) because it boots a real dedicated server via the `gameTestServer` run,
// rather than running in-process under the plain `test` task. Mirrors fabric/src/gametest,
// and (like Fabric's separate "logistics_gametest" mod) ships as its own modid rather than
// folding into the `logistics` mod — see neoforge/src/gametest/resources/META-INF/neoforge.mods.toml.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output + tasks.named('compileJava', JavaCompile).get().classpath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

neoForge {
    // This single property pins BOTH NeoForge AND the Minecraft it runs on. NeoForge ships as a
    // patched fork of one specific MC build, so ModDevGradle derives the game version from this
    // artifact's metadata — there is intentionally no `minecraft_version` knob here. That property
    // only drives Fabric/Loom (and common's compile classpath); the NeoForge side's MC is implied
    // by neoforge_version. To target a different MC on NeoForge, pick the matching neoforge_version
    // (NeoForge and MC are released in lockstep), not minecraft_version.
    version = neoforge_version
    addModdingDependenciesTo sourceSets.gametest
    runs {
        client {
            client()
            gameDirectory = project.file('runs/client')
        }
        server {
            server()
            gameDirectory = project.file('runs/server')
        }
        gameTestServer {
            type = "gameTestServer"
            gameDirectory = project.file('runs/gameTestServer')
            // Per-test results, so a failure names the test rather than only the run. Vanilla's
            // report writer does not create the directory itself, hence the mkdirs below.
            programArguments.addAll('--report',
                    layout.buildDirectory.file('test-results/gameTestServer/report.xml').get().asFile.absolutePath)
        }
    }
    mods {
        logistics {
            sourceSet sourceSets.main
        }
        "logistics_gametest" {
            sourceSet sourceSets.gametest
        }
    }
}

tasks.named('compileJava', JavaCompile) {
    dependsOn configurations.commonClientJava
    source configurations.commonClientJava
}

tasks.named('compileTestJava', JavaCompile) {
    classpath += tasks.named('compileJava', JavaCompile).get().classpath
}

dependencies {
    // JEI — compile against API only; players install separately at runtime
    compileOnly("mezz.jei:jei-${rootProject.jei_mc_version}-neoforge-api:${rootProject.jei_version}")
    runtimeOnly("mezz.jei:jei-${rootProject.jei_mc_version}-neoforge:${rootProject.jei_version}")

    // Jade HUD — compile against the API only; never bundled.
    compileOnly("maven.modrinth:jade:${rootProject.jade_neoforge_version}")
    // No Jade NeoForge build for MC 26.2 yet — the 26.1.x jar is runtime-incompatible
    // (NoClassDefFoundError MinMaxBounds$Ints, which moved in 26.2) and crashes runClient
    // during mod construction. Keep it off the runtime classpath until a 26.2 build ships;
    // restore runtimeOnly (and test the in-game HUD) then. The release jar is unaffected.
    // runtimeOnly("maven.modrinth:jade:${rootProject.jade_neoforge_version}")

    // Spark profiler (https://spark.lucko.me) — loaded in dev via runClient/runServer, never bundled.
    // If a future MC snapshot has no matching Spark build, comment this out until one ships.
    runtimeOnly("maven.modrinth:spark:${rootProject.spark_neoforge_version}")

    // Sentry SDK for opt-in crash reporting. jarJar bundles it (range allows dedup with another mod
    // shipping Sentry); implementation puts it on compile+runtime so the injected common sources compile.
    jarJar(implementation("io.sentry:sentry")) {
        version {
            strictly "[${rootProject.sentry_version},9.0.0)"
            prefer "${rootProject.sentry_version}"
        }
    }

    // Configory config library — jarJar bundles it; implementation compiles the injected common sources.
    // Pinned to an exact version (see common/build.gradle).
    jarJar(implementation("maven.modrinth:configory:${rootProject.configory_version}"))

    testImplementation "org.junit.jupiter:junit-jupiter:${rootProject.junit_version}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "org.assertj:assertj-core:${rootProject.assertj_version}"
    testImplementation "net.neoforged:neoforge:${rootProject.neoforge_version}"
}

test {
    useJUnitPlatform()
    classpath += tasks.named('compileJava', JavaCompile).get().classpath
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat = "full"
    }
}

// Sentry source-context upload (so stack traces show inline source in Sentry). Gated on the
// SENTRY_AUTH_TOKEN secret: local/PR builds without it skip the upload entirely and never fail.
// We manage the SDK dependency ourselves above, so the plugin's auto-install/telemetry stay off.
def sentryAuthToken = System.getenv("SENTRY_AUTH_TOKEN")
sentry {
    includeSourceContext = sentryAuthToken != null && !sentryAuthToken.isEmpty()
    org = "indmenity83"
    projectName = "logistics-mod"
    authToken = sentryAuthToken
    autoInstallation {
        enabled = false
    }
    telemetry = false
}

// The Sentry plugin emits generated metadata into the main resources, which withSourcesJar() also
// picks up; declare the dependency so Gradle doesn't reject the implicit one on `build`.
tasks.named('sourcesJar') {
    dependsOn(tasks.matching {
        it.name.toLowerCase().startsWith('generatesentry') || it.name == 'collectExternalDependenciesForSentry'
    })
}

processResources {
    def compatibilityBounds = rootProject.minecraft_compatibility_versions.split(',').collect { it.trim() }
    if (compatibilityBounds.size() != 2 || compatibilityBounds.any { it.isEmpty() }) {
        throw new GradleException("minecraft_compatibility_versions must be formatted as '<min>,<next>'")
    }
    // The shared compatibility bounds are in Fabric's normalized semver form (pre-release with a
    // dot, e.g. "26.2-pre.3"). NeoForge/Maven compares against the RAW Minecraft version (dash,
    // e.g. "26.2-pre-4"), so a dotted bound never matches. Convert the pre-release dot back to a
    // dash for the NeoForge Maven range; release bounds like "26.3" are unaffected.
    def toNeoForgeVersion = { String v -> v.replace('-pre.', '-pre-').replace('-rc.', '-rc-') }
    def neoforgeMinecraftVersionRange = "[${toNeoForgeVersion(compatibilityBounds[0])}, ${toNeoForgeVersion(compatibilityBounds[1])})"

    var expandProps = [
        'version'                         : project.version,
        'minecraft_version'               : rootProject.minecraft_version,
        'neoforge_minecraft_version_range': neoforgeMinecraftVersionRange,
        'neoforge_version'                : rootProject.neoforge_version,
        'neoforge_loader_version_range'   : rootProject.neoforge_loader_version_range,
    ]
    filesMatching('META-INF/neoforge.mods.toml') {
        expand expandProps
    }
    inputs.properties(expandProps)
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = rootProject.java_version.toInteger()
}

jar {
    from('../LICENSE') {
        rename { "${it}_logistics" }
    }
}

tasks.named('runGameTestServer') {
    doFirst {
        layout.buildDirectory.file('test-results/gameTestServer/report.xml').get().asFile.parentFile.mkdirs()
    }
}
