pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'NeoForge'
            url = 'https://maven.neoforged.net/releases/'
        }
        gradlePluginPortal()
    }
    plugins {
        // Declare version centrally so subproject plugins {} blocks omit the version.
        // Most versions come from gradle.properties. Spotless is deliberately a literal:
        // Dependabot's Gradle parser resolves ${...} only against quoted assignments in
        // build.gradle, never against gradle.properties, so a property-backed version is
        // one it silently stops bumping.
        id 'net.fabricmc.fabric-loom' version "${loom_version}"
        id 'net.neoforged.moddev' version "${moddev_version}"
        id 'com.diffplug.spotless' version '8.9.0'
        id 'io.sentry.jvm.gradle' version "${sentry_gradle_version}"
    }
}

rootProject.name = 'logistics'
include 'common', 'fabric', 'neoforge'
