// Fabric loader subproject.
// archivesName is overridden below to restore the original "logistics-${version}.jar" output,
// matching what CI workflows expect. The convention plugin default includes project.name and
// minecraft_version, which would produce "logistics-fabric-26.1-${version}.jar" instead.
plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

version = System.getenv("MOD_VERSION") ?: "dev-fabric"

base {
    archivesName = rootProject.archives_base_name
}

repositories {
    maven { url = "https://maven.terraformersmc.com/releases/" }
    maven { name = "Jared's maven"; url = "https://maven.blamejared.com/" }
}

loom {
    splitEnvironmentSourceSets()

    accessWidenerPath = project(':common').file("src/main/resources/logistics.accesswidener")

    mods {
        "logistics" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "logistics-gametest"
        enableGameTests = true
        eula = true
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_version}"

    testImplementation "org.junit.jupiter:junit-jupiter:${rootProject.junit_version}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "org.assertj:assertj-core:${rootProject.assertj_version}"

    // Team Reborn Energy API
    include("teamreborn:energy:${rootProject.fabric_energy_version}")
    implementation("teamreborn:energy:${rootProject.fabric_energy_version}")

    // Sentry crash reporting SDK — bundled into the Fabric jar via include (jar-in-jar)
    include("io.sentry:sentry:${rootProject.sentry_version}")
    implementation("io.sentry:sentry:${rootProject.sentry_version}")

    // JEI — compile against API only; players install separately at runtime
    compileOnly("mezz.jei:jei-${rootProject.minecraft_version}-fabric:${rootProject.jei_version}")
    runtimeOnly("mezz.jei:jei-${rootProject.minecraft_version}-fabric:${rootProject.jei_version}")
}

processResources {
    def compatibilityBounds = rootProject.minecraft_compatibility_versions.split(',').collect { it.trim() }
    if (compatibilityBounds.size() != 2 || compatibilityBounds.any { it.isEmpty() }) {
        throw new GradleException("minecraft_compatibility_versions must be formatted as '<min>,<next>'")
    }
    def fabricMinecraftVersionRange = ">=${compatibilityBounds[0]} <${compatibilityBounds[1]}"

    inputs.property "version", project.version
    inputs.property "minecraft_version", rootProject.minecraft_version
    inputs.property "fabric_minecraft_version_range", fabricMinecraftVersionRange
    inputs.property "fabric_version", rootProject.fabric_version
    inputs.property "fabric_loader_version", rootProject.fabric_loader_version
    inputs.property "java_version", rootProject.java_version
    filesMatching("fabric.mod.json") {
        expand inputs.properties
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat = "full"
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = rootProject.java_version.toInteger()
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    inputs.property "archivesName", project.base.archivesName
    from("../LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}
