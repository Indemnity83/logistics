// Common subproject — shared domain code, compiles against vanilla MC via Loom.
// splitEnvironmentSourceSets() creates src/main (server-safe) and src/client (client-only).
//
// TODO(multiloader): swap net.fabricmc.fabric-loom here for net.neoforged.moddev.
//   MDG supports MC 26.1 (confirmed via MultiLoader-Template/tree/26.1). The blocker is
//   that common/ currently imports Fabric API directly (~25 classes across the codebase).
//   When ready:
//   - Replace the loom {} block with neoForge { neoFormVersion = neo_form_version }
//   - Remove Fabric API / fabric-loader dependencies (common should depend only on vanilla MC)
//   - Move FabricBlockEntityTypeBuilder usage out of LogisticsMod.java behind an abstraction
//     (vanilla BlockEntityType has a private constructor in MC 26.1; needs a loader helper)
//   - Apply multiloader-loader in neoforge/build.gradle to compile common sources there
//   See: https://github.com/jaredlll08/MultiLoader-Template/tree/26.1
plugins {
    id 'multiloader-common'
    id 'net.fabricmc.fabric-loom'
}

repositories {
    // exclusiveContent, not content: `content` says a repo *serves* a group, but does not stop other
    // repos being probed for it. Maven Central (added by the loader plugins) was still asked for JEI
    // and Jade, which it has never hosted -- normally a harmless 404, but a 429 or timeout from
    // Central is a transport error, and Gradle fails the build instead of advancing to the next repo.
    // exclusiveContent makes these groups resolvable *only* here, so Central is never asked at all.
    // Both JEI mirrors stay in one block, BlameJared first, so failover survives a TerraformersMC outage.
    exclusiveContent {
        forRepositories(
            maven { name = "Jared's maven"; url = "https://maven.blamejared.com/" },
            maven { name = "TerraformersMC"; url = "https://maven.terraformersmc.com/releases/" }
        )
        filter {
            includeGroup "mezz.jei"
            includeGroup "com.terraformersmc"
        }
    }
    exclusiveContent {
        forRepository { maven { name = "Modrinth"; url = "https://api.modrinth.com/maven" } }
        filter { includeGroup "maven.modrinth" }
    }
}

loom {
    splitEnvironmentSourceSets()
    // No mods {} block — common is a compilation target, not a runnable mod.
    accessWidenerPath = file("src/main/resources/logistics.accesswidener")
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"

    testImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    // fabric-api is NOT on the main compile classpath — only test runtime needs it for the mixin
    // system (fabric-loader-junit initializes the Fabric environment which applies Fabric API mixins)
    testImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_version}"

    // Team Reborn Energy API (bundled into the Fabric jar via include in fabric/build.gradle)
    implementation("teamreborn:energy:${rootProject.fabric_energy_version}")

    // Sentry SDK for opt-in crash reporting (pure Java, no transitive deps). Bundled per loader
    // via include (Fabric) / jarJar (NeoForge); here it compiles common and runs the unit tests.
    implementation("io.sentry:sentry:${rootProject.sentry_version}")

    // Configory config library (pure Java; only transitive dep is Gson, already on the MC classpath).
    // Bundled per loader via include (Fabric) / jarJar (NeoForge). Pinned to an exact version — a range
    // makes Gradle resolve it from the Modrinth maven's metadata, which is unreliable.
    implementation("maven.modrinth:configory:${rootProject.configory_version}")

    // JEI — compile only; players install separately at runtime
    compileOnly("mezz.jei:jei-${rootProject.jei_mc_version}-fabric:${rootProject.jei_version}")

    // Jade HUD — compile only; players install separately at runtime. The Jade API is identical across
    // loaders, so the shared compat.jade providers compile here once and both loaders reuse them; each
    // loader still declares its own Jade dependency for its runtime/plugin-registration half.
    compileOnly("maven.modrinth:jade:${rootProject.jade_fabric_version}")

    // Test infrastructure
    testImplementation "org.junit.jupiter:junit-jupiter:${rootProject.junit_version}"
    testImplementation "net.fabricmc:fabric-loader-junit:${rootProject.fabric_loader_version}"
    testImplementation "org.assertj:assertj-core:${rootProject.assertj_version}"
}

sourceSets {
    test {
        java { srcDir 'src/test/java' }
    }
    // Shared GameTest bodies (plain vanilla GameTestHelper logic, no Fabric/NeoForge imports) —
    // consumed as raw source by fabric/src/gametest and neoforge/src/gametest, the same way
    // `client` is consumed by each loader's own client source set. Not part of the shipped jar.
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = rootProject.java_version.toInteger()
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat = "full"
        showStandardStreams = false
    }
    failFast = false
    maxParallelForks = Runtime.runtime.availableProcessors().intdiv(2) ?: 1
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    inputs.property "archivesName", project.base.archivesName
    from("../LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}

// ------------------------------------------------------------------------------------------------
// Loader-independent API jar — the cross-mod tank/fluid contract for downstream mods (e.g. irontanks).
//
// These packages are loader-agnostic and compile against Mojang official mappings (verified: public
// signatures use net.minecraft.world.level.Level, not intermediary class_*), so ONE jar serves both
// Fabric and NeoForge consumers. Consume it with plain `compileOnly` (NOT modCompileOnly, so Loom
// leaves it un-remapped) and guard use behind a mod-loaded check; the consumer's own remap carries
// call sites to its runtime mappings, matching the separately-installed logistics mod jar.
//
// Scope is the full transitive closure of the public contract — keep it minimal so internals stay
// off downstream classpaths.
def apiPackages = [
    'com/logistics/api/**',
    'com/logistics/core/lib/tank/**',
    'com/logistics/core/lib/fluids/**',
    'com/logistics/core/lib/compat/**',
    'com/logistics/core/lib/resource/**',
]

tasks.register('apiJar', Jar) {
    description = 'Loader-independent API jar for downstream mods to compile against.'
    group = 'build'
    archiveBaseName = "${rootProject.archives_base_name}-api"
    from(sourceSets.main.output) {
        include apiPackages
    }
    from("../LICENSE") {
        rename { "${it}_${rootProject.archives_base_name}-api" }
    }
}

tasks.named('assemble') {
    dependsOn 'apiJar'
}

publishing {
    publications {
        api(MavenPublication) {
            groupId = rootProject.maven_group
            artifactId = "${rootProject.archives_base_name}-api"
            version = project.version
            artifact tasks.named('apiJar')
        }
    }
}
