name: Check Code

on:
  push:
    branches: ['mc/**']
  pull_request:
    branches: ['mc/**']
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      code_changed: ${{ steps.changed.outputs.code_changed }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ github.token }}

      - name: Detect code changes
        id: changed
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE="$PR_BASE_SHA"
            HEAD="HEAD"
          else
            BASE="$PUSH_BEFORE"
            HEAD="$PUSH_AFTER"
          fi

          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          code_changed=false
          while IFS= read -r file; do
            case "$file" in
              common/*|fabric/*|neoforge/*|buildSrc/*|gradle/*|\
              build.gradle|settings.gradle|gradle.properties|gradlew|gradlew.bat|\
              .github/workflows/check-code.yml)
                code_changed=true
                break
                ;;
            esac
          done < <(git diff --name-only "$BASE" "$HEAD")

          echo "code_changed=$code_changed" >> "$GITHUB_OUTPUT"
          echo "code_changed=$code_changed"

  lint:
    name: lint (${{ matrix.module }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [common, fabric, neoforge]

    steps:
      - name: Skip lint for non-code changes
        if: needs.changes.outputs.code_changed != 'true'
        run: echo "No code-affecting files changed; skipping Gradle lint."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: needs.changes.outputs.code_changed == 'true'
        with:
          persist-credentials: false
          token: ${{ github.token }}

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        if: needs.changes.outputs.code_changed == 'true'
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        if: needs.changes.outputs.code_changed == 'true'
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Check ${{ matrix.module }} formatting
        if: needs.changes.outputs.code_changed == 'true'
        run: ./gradlew :${{ matrix.module }}:lint --console=plain

  test:
    name: test (${{ matrix.module }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every module runs tests; only common uploads coverage because loader
        # adapters are mostly integration glue around Minecraft APIs.
        module: [common, fabric, neoforge]

    steps:
      - name: Skip tests for non-code changes
        if: needs.changes.outputs.code_changed != 'true'
        run: echo "No code-affecting files changed; skipping Gradle tests."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: needs.changes.outputs.code_changed == 'true'
        with:
          persist-credentials: false
          token: ${{ github.token }}

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        if: needs.changes.outputs.code_changed == 'true'
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        if: needs.changes.outputs.code_changed == 'true'
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Run ${{ matrix.module }} tests with coverage
        if: needs.changes.outputs.code_changed == 'true'
        run: ./gradlew :${{ matrix.module }}:jacocoTestReport --console=plain
        # jacocoTestReport depends on the module's test task, so this runs the
        # tests once and emits the JaCoCo XML in the same step.
        # Note: Fabric game tests run separately in the `gametest` job below.

      - name: Upload test reports
        if: needs.changes.outputs.code_changed == 'true' && failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-reports-${{ matrix.module }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ matrix.module }}/build/reports/tests/test/

      - name: Upload common coverage to Codecov
        if: needs.changes.outputs.code_changed == 'true' && matrix.module == 'common'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ${{ matrix.module }}/build/reports/jacoco/test/jacocoTestReport.xml
          flags: ${{ matrix.module }}
          # Coverage is informational, not a correctness gate. Keep this non-blocking so a
          # Codecov-side issue (e.g. the uploader's GPG key-import failing to verify the
          # auto-updated CLI binary) can't fail an otherwise-green CI run.
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  gametest:
    name: gametest (fabric)
    # Fabric is the only module with a gametest source set; it boots a headless
    # server, so it runs as its own job rather than in the unit-test matrix.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Skip game tests for non-code changes
        if: needs.changes.outputs.code_changed != 'true'
        run: echo "No code-affecting files changed; skipping Fabric game tests."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: needs.changes.outputs.code_changed == 'true'
        with:
          persist-credentials: false
          token: ${{ github.token }}

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        if: needs.changes.outputs.code_changed == 'true'
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        if: needs.changes.outputs.code_changed == 'true'
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Run Fabric game tests
        if: needs.changes.outputs.code_changed == 'true'
        run: ./gradlew :fabric:runGameTest --console=plain

      - name: Upload game test logs
        if: needs.changes.outputs.code_changed == 'true' && failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gametest-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: fabric/build/run/gameTest/logs/
