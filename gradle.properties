# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# EVERY version in this file is hand-maintained. Dependabot cannot see it: its Gradle parser
# resolves ${...} only against quoted assignments in build.gradle/build.gradle.kts, so anything
# declared here is frozen until a human bumps it. That is the right home for the pins below,
# which are per-branch Minecraft policy rather than "latest wins" — an automated bump would
# break the branch. Versions that *should* float (junit, assertj, sentry) live in build.gradle's
# ext block, and the floating plugin versions are literals in settings.gradle.
# Do not move a floating version in here: that takes it out of Dependabot's reach (see #1161,
# and #1018 where exactly that was proposed for Spotless and declined).

# Mod Properties
maven_group=com.logistics
archives_base_name=logistics

# Minecraft
minecraft_version=1.21.11
# Half-open compatibility range as exactly "<min>,<next>" with no spaces; min is inclusive, next is exclusive.
minecraft_compatibility_versions=1.21.11,1.21.12
java_version=21

# Fabric
# check these on https://fabricmc.net/develop
fabric_loader_version=0.18.4
fabric_version=0.141.3+1.21.11
loom_version=1.16-SNAPSHOT
fabric_energy_version=4.2.0

# NeoForge
# check versions at https://projects.neoforged.net/neoforged/neoforge
neoforge_version=21.11.42
neoforge_loader_version_range=[4,)
neo_form_version=1.21.11-1

# Dependencies
# Configory config library (bundled per loader; consumed from the Modrinth maven).
configory_version=0.2.0
# JEI is the one dependency whose *artifact id* embeds a Minecraft version
# (mezz.jei:jei-<mc>-fabric), so a version bump breaks resolution until JEI publishes for the new
# release — which can be weeks, and leaves the branch unable to compile or test anything until then.
# jei_mc_version is that artifact's Minecraft line, kept separate from minecraft_version so a
# pre-release branch can compile against the last line JEI shipped for. The API we use is stable
# across lines. Raise it to match minecraft_version once JEI catches up.
# Jade and spark need no equivalent: their Minecraft line lives in the version string below, so
# pointing them at an older build is just a version change.
jei_mc_version=1.21.11
jei_version=27.4.0.21
jade_fabric_version=21.1.6+fabric
jade_neoforge_version=21.1.7+neoforge
