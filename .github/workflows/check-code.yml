name: Check Code

on:
  push:
    branches: ['mc/**']
  pull_request:
    branches: ['mc/**']
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      code_changed: ${{ steps.changed.outputs.code_changed }}
      client_changed: ${{ steps.changed.outputs.client_changed }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ github.token }}

      - name: Detect code changes
        id: changed
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE="$PR_BASE_SHA"
            HEAD="HEAD"
          else
            BASE="$PUSH_BEFORE"
            HEAD="$PUSH_AFTER"
          fi

          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            echo "client_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A rewritten/force-pushed base may no longer exist; treat a failed diff as "code changed"
          # so CI runs the full checks rather than silently skipping them on an empty diff.
          if ! changed_files=$(git diff --name-only "$BASE" "$HEAD" 2>/dev/null); then
            echo "git diff against base '$BASE' failed (rewritten history?); assuming code changed."
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            echo "client_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          code_changed=false
          # Client feature tests boot a real client, so they only run when something they can
          # actually see changed: client code, rendering, or shipped assets.
          client_changed=false
          while IFS= read -r file; do
            case "$file" in
              common/*|fabric/*|neoforge/*|buildSrc/*|gradle/*|\
              build.gradle|settings.gradle|gradle.properties|gradlew|gradlew.bat|\
              .github/workflows/check-code.yml)
                code_changed=true
                ;;
            esac
            # Build files count: fabric/build.gradle is where the client test harness is configured
            # (fabricApi.configureTests), and gradle.properties pins the loom and fabric-api
            # versions it comes from. A change there can remove the run config entirely, so the job
            # that would notice must not skip.
            case "$file" in
              */src/client/*|*/src/main/resources/assets/*|\
              fabric/src/gametest/java/com/logistics/gametest/client/*|\
              fabric/src/gametest/resources/fabric.mod.json|\
              fabric/build.gradle|build.gradle|gradle.properties|\
              .github/workflows/check-code.yml)
                client_changed=true
                ;;
            esac
            if [[ "$code_changed" == "true" && "$client_changed" == "true" ]]; then
              break
            fi
          done <<< "$changed_files"

          echo "code_changed=$code_changed" >> "$GITHUB_OUTPUT"
          echo "client_changed=$client_changed" >> "$GITHUB_OUTPUT"
          echo "code_changed=$code_changed client_changed=$client_changed"

  docs:
    name: lint (docs)
    # Deliberately not gated on the changes job: AGENTS.md drift is a docs-only
    # change, so a path filter would skip precisely the case this catches. It
    # also runs on push, because a direct port push is how the two last drifted
    # apart.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: AGENTS.md must mirror CLAUDE.md
        shell: bash
        run: |
          set -euo pipefail

          fail() { echo "::error file=AGENTS.md::$1"; exit 1; }

          [ -f CLAUDE.md ] || fail "CLAUDE.md is missing."
          [ -f AGENTS.md ] || fail "AGENTS.md is missing. It must mirror CLAUDE.md."

          # The two files are identical except for their opening two lines, which
          # name the agent each one addresses.
          [ "$(sed -n 1p CLAUDE.md)" = "# CLAUDE.md" ] \
            || fail "CLAUDE.md line 1 must be '# CLAUDE.md'."
          [ "$(sed -n 1p AGENTS.md)" = "# AGENTS.md" ] \
            || fail "AGENTS.md line 1 must be '# AGENTS.md'."
          [ "$(sed -n 3p AGENTS.md)" = "This file provides guidance to codex when working with code in this repository." ] \
            || fail "AGENTS.md line 3 must be the codex guidance line."

          if ! diff -u <(tail -n +4 CLAUDE.md) <(tail -n +4 AGENTS.md) \
                 --label CLAUDE.md --label AGENTS.md; then
            echo
            echo "AGENTS.md has drifted from CLAUDE.md. Edit CLAUDE.md, then regenerate:"
            echo
            echo "  { sed -n '1,3p' AGENTS.md; tail -n +4 CLAUDE.md; } > /tmp/a && mv /tmp/a AGENTS.md"
            echo
            fail "AGENTS.md and CLAUDE.md differ below their opening lines."
          fi

          echo "AGENTS.md mirrors CLAUDE.md."

  actions:
    name: lint (actions)
    # Deliberately not gated on the changes job: a workflow edit is not a code
    # change, so a path filter would skip precisely the case this catches. It
    # also runs on push, because a direct port push is how an unpinned action
    # would reach a perennial branch without review.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Test the pinning checker
        shell: bash
        run: python3 .github/scripts/test_check_action_pinning.py

      - name: Actions must be pinned to a commit SHA
        shell: bash
        run: python3 .github/scripts/check-action-pinning.py

  lint:
    name: lint (${{ matrix.module }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [common, fabric, neoforge]

    steps:
      - name: Skip lint for non-code changes
        if: needs.changes.outputs.code_changed != 'true'
        run: echo "No code-affecting files changed; skipping Gradle lint."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: needs.changes.outputs.code_changed == 'true'
        with:
          persist-credentials: false
          token: ${{ github.token }}

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        if: needs.changes.outputs.code_changed == 'true'
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        if: needs.changes.outputs.code_changed == 'true'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Check ${{ matrix.module }} formatting
        if: needs.changes.outputs.code_changed == 'true'
        run: ./gradlew :${{ matrix.module }}:lint --console=plain

  test:
    name: unit-test (${{ matrix.module }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every module runs tests; only common uploads coverage because loader
        # adapters are mostly integration glue around Minecraft APIs.
        module: [common, fabric, neoforge]

    steps:
      - name: Skip tests for non-code changes
        if: needs.changes.outputs.code_changed != 'true'
        run: echo "No code-affecting files changed; skipping Gradle tests."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: needs.changes.outputs.code_changed == 'true'
        with:
          persist-credentials: false
          token: ${{ github.token }}

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        if: needs.changes.outputs.code_changed == 'true'
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        if: needs.changes.outputs.code_changed == 'true'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Run ${{ matrix.module }} tests with coverage
        if: needs.changes.outputs.code_changed == 'true'
        run: ./gradlew :${{ matrix.module }}:jacocoTestReport --console=plain
        # jacocoTestReport depends on the module's test task, so this runs the
        # tests once and emits the JaCoCo XML in the same step.
        # Note: Fabric/NeoForge game tests run separately in the `gametest` job below.

      - name: Upload test reports
        if: needs.changes.outputs.code_changed == 'true' && failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-reports-${{ matrix.module }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ matrix.module }}/build/reports/tests/test/

      - name: Upload common coverage to Codecov
        if: needs.changes.outputs.code_changed == 'true' && matrix.module == 'common'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ${{ matrix.module }}/build/reports/jacoco/test/jacocoTestReport.xml
          flags: ${{ matrix.module }}
          # Coverage is informational, not a correctness gate. Keep this non-blocking so a
          # Codecov-side issue (e.g. the uploader's GPG key-import failing to verify the
          # auto-updated CLI binary) can't fail an otherwise-green CI run.
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  gametest:
    name: feature-test (${{ matrix.loader }})
    # Both loaders boot a headless server for their gametest source set, so this runs as its own
    # job (matrixed by loader) rather than in the unit-test matrix.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - loader: fabric
            task: ':fabric:runGameTest'
            logs: fabric/build/run/gameTest/logs/
            report: fabric/build/test-results/gameTest/report.xml
          - loader: neoforge
            task: ':neoforge:runGameTestServer'
            logs: neoforge/runs/gameTestServer/logs/
            report: neoforge/build/test-results/gameTestServer/report.xml

    steps:
      - name: Skip game tests for non-code changes
        if: needs.changes.outputs.code_changed != 'true'
        run: echo "No code-affecting files changed; skipping ${{ matrix.loader }} game tests."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: needs.changes.outputs.code_changed == 'true'
        with:
          persist-credentials: false
          token: ${{ github.token }}

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        if: needs.changes.outputs.code_changed == 'true'
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        if: needs.changes.outputs.code_changed == 'true'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Run ${{ matrix.loader }} game tests
        if: needs.changes.outputs.code_changed == 'true'
        run: ./gradlew ${{ matrix.task }} --console=plain

      - name: Upload game test logs
        if: needs.changes.outputs.code_changed == 'true' && failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gametest-logs-${{ matrix.loader }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ matrix.logs }}

      - name: Upload game test report
        if: needs.changes.outputs.code_changed == 'true' && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gametest-report-${{ matrix.loader }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ matrix.report }}

  client-test:
    name: client-test (fabric)
    # Boots a real Minecraft client, so it needs a display (xvfb) and costs more than the headless
    # suites. Gated on changes it could actually see rather than run on every PR.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Skip client feature tests for non-client changes
        if: needs.changes.outputs.client_changed != 'true'
        run: echo "No client, rendering, or asset files changed; skipping client feature tests."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: needs.changes.outputs.client_changed == 'true'
        with:
          persist-credentials: false
          token: ${{ github.token }}

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        if: needs.changes.outputs.client_changed == 'true'
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        if: needs.changes.outputs.client_changed == 'true'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Install a virtual display
        if: needs.changes.outputs.client_changed == 'true'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run Fabric client feature tests
        if: needs.changes.outputs.client_changed == 'true'
        run: xvfb-run -a ./gradlew :fabric:runClientGameTest --console=plain

      - name: Upload client feature test screenshots
        # Uploaded on success too: these are review artifacts, not just failure diagnostics.
        if: needs.changes.outputs.client_changed == 'true' && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: client-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: fabric/build/run/clientGameTest/screenshots/

      - name: Upload client feature test logs
        if: needs.changes.outputs.client_changed == 'true' && failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: client-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: fabric/build/run/clientGameTest/logs/
