pluginManagement {
    repositories {
        // Scope each mod maven to the groups it serves. Gradle advances to the next repository only
        // on a 404 -- a transport error (timeout, refused connection) fails plugin resolution
        // outright -- so an unscoped mod maven listed ahead of the portal takes down resolution of
        // *every* plugin, including spotless and sentry, which only the portal serves.
        // Plain `content` here rather than the `exclusiveContent` the module builds use: it keeps
        // the mod mavens from being asked for foreign groups without removing the portal as a
        // fallback for released loom/moddev versions.
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
            content { includeGroupByRegex 'net\\.fabricmc.*' }
        }
        maven {
            name = 'NeoForge'
            url = 'https://maven.neoforged.net/releases/'
            content { includeGroupByRegex 'net\\.neoforged.*' }
        }
        gradlePluginPortal()
    }
    plugins {
        // Declare version centrally so subproject plugins {} blocks omit the version.
        // Versions here are literals so Dependabot can bump them: its Gradle parser resolves
        // ${...} only against quoted assignments in build.gradle, never against
        // gradle.properties, so a property-backed version is one it silently stops bumping.
        // A version catalog is not an option in this block either -- catalogs are evaluated
        // after settings plugins, so `libs` accessors do not exist here (gradle/gradle#36437).
        // loom is the exception: it is a per-branch Minecraft pin, not "latest wins".
        id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
        id 'net.neoforged.moddev' version '2.0.141'
        id 'com.diffplug.spotless' version '8.10.2'
        id 'io.sentry.jvm.gradle' version '6.22.0'
    }
}

rootProject.name = 'logistics'
include 'common', 'fabric', 'neoforge'
