name: Check PR

on:
  pull_request:
    branches: ['mc/**']
    types: [opened, edited, synchronize, reopened, ready_for_review]

# No concurrency group, deliberately. `lint (pr)` is a required check, and `cancelled` is not one
# of the conclusions branch protection accepts (only success, skipped and neutral are), so a
# cancelled run blocks the merge with no failure to diagnose. release-please regenerates a release
# PR by pushing a commit and rewriting the title/body in the same instant, so `synchronize` and
# `edited` both fire for the *same* head SHA -- unlike check-code.yml, where a cancelled run is
# always a superseded commit. Grouping cannot be made safe here: GitHub cancels a previously
# pending run in a group regardless of `cancel-in-progress`, so back-to-back events still strand a
# cancelled check. The job is one JS action with no checkout and no Gradle, so running it a few
# extra times is far cheaper than the manual re-runs the cancellations cost.

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: lint (pr)
    runs-on: ubuntu-latest

    permissions:
      pull-requests: read

    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            balance
            change
            deprecate
            remove
            fix
            security
            docs
            refactor
            perf
            test
            build
            ci
            chore
            revert

          scopes: |
            core
            automation
            macerator
            kiln
            quarry
            sawmill
            pump
            transport
            routing
            pipes
            fluids
            energy
            storage
            crafting
            worldgen
            ui
            api
            compat
            common
            fabric
            neoforge
            docs
            build
            ci
            release

          requireScope: true
          validateSingleCommit: false

          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            should start with a lowercase letter.

            Good:
              fix(pipes): prevent items from getting stuck
              feat(energy): add energy pipe support

            Bad:
              Fix(pipes): Prevent items from getting stuck
