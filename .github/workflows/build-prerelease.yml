name: Build (Pre-release)

on:
  workflow_dispatch:
    inputs:
      number:
        description: "Pre-release number (1, 2, 3...)"
        required: true
        default: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        loader: [fabric]

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Extract version information
        id: version
        shell: bash
        run: |
          set -euo pipefail

          BASE_VERSION="$(jq -r '."."' .release-please-manifest.json)"
          if [[ -z "$BASE_VERSION" || "$BASE_VERSION" == "null" ]]; then
            echo "Failed to resolve BASE_VERSION from .release-please-manifest.json" >&2
            exit 1
          fi

          NUMBER="${{ inputs.number }}"
          [[ "$NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo "Invalid number: must be a positive integer"; exit 1; }

          PRE_VERSION="${BASE_VERSION}-pre.${NUMBER}"

          MC_VERSION="$(grep '^minecraft_version=' gradle.properties | cut -d'=' -f2)"
          LOADER="${{ matrix.loader }}"

          FULL_VERSION="${PRE_VERSION}+mc${MC_VERSION}.${LOADER}"

          # Gradle task
          if [[ "$MC_VERSION" =~ ^([0-9]+)\. ]]; then
            (( ${BASH_REMATCH[1]} >= 26 )) && GRADLE_TASK="jar" || GRADLE_TASK="remapJar"
          else
            GRADLE_TASK="remapJar"
          fi

          # CI is fabric-only for now. Keep token explicit.
          LOADER_SHORT="f"

          MODRINTH_VERSION="${PRE_VERSION}+mc${MC_VERSION}.${LOADER_SHORT}"
          (( ${#MODRINTH_VERSION} > 32 )) && MODRINTH_VERSION="${MODRINTH_VERSION:0:32}"

          echo "pre_version=$PRE_VERSION" >> $GITHUB_OUTPUT
          echo "modrinth_version=$MODRINTH_VERSION" >> $GITHUB_OUTPUT
          echo "full_version=$FULL_VERSION" >> $GITHUB_OUTPUT
          echo "minecraft_version=$MC_VERSION" >> $GITHUB_OUTPUT
          echo "loader=$LOADER" >> $GITHUB_OUTPUT
          echo "gradle_task=$GRADLE_TASK" >> $GITHUB_OUTPUT

          echo "Building $FULL_VERSION"

      - name: Build
        run: ./gradlew ${{ steps.version.outputs.gradle_task }} --console=plain
        env:
          MOD_VERSION: ${{ steps.version.outputs.full_version }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: logistics-${{ steps.version.outputs.full_version }}
          path: build/libs/logistics-${{ steps.version.outputs.full_version }}.jar

      - name: Publish
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-version: ${{ steps.version.outputs.modrinth_version }}

          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          game-version-filter: releases
          version-type: beta
          version: ${{ steps.version.outputs.full_version }}
          name: "Logistics v${{ steps.version.outputs.pre_version }} for ${{ steps.version.outputs.loader }} ${{ steps.version.outputs.minecraft_version }}"

          files: build/libs/logistics-${{ steps.version.outputs.full_version }}.jar

      - name: Notify Discord beta-testing
        if: success()
        shell: bash
        env:
          DISCORD_BETA_WEBHOOK_URL: ${{ secrets.DISCORD_BETA_WEBHOOK_URL }}
          PRE_VERSION: ${{ steps.version.outputs.pre_version }}
          MC_VERSION: ${{ steps.version.outputs.minecraft_version }}
          LOADER: ${{ steps.version.outputs.loader }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
        run: |
          if [[ -z "$DISCORD_BETA_WEBHOOK_URL" ]]; then
            echo "DISCORD_BETA_WEBHOOK_URL not set, skipping notification"
            exit 0
          fi

          MODRINTH_URL="https://modrinth.com/mod/${MODRINTH_PROJECT_ID}/versions?c=beta"

          PAYLOAD=$(jq -n \
            --arg title "🧪 Beta build ready: Logistics v${PRE_VERSION} for MC ${MC_VERSION} (${LOADER})" \
            --arg url "$MODRINTH_URL" \
            '{
              "content": "@everyone",
              "allowed_mentions": {"parse": ["everyone"]},
              "embeds": [{
                "title": $title,
                "url": $url,
                "description": "A new pre-release build is available on Modrinth.\n\n**Please test:**\n• Load a world from the previous stable release — verify pipes, filters, and engines are intact\n• Run through the smoke test steps in `docs/RELEASE_CHECKLIST.md §C`\n• Report findings in this channel or on GitHub Issues\n\n[Download beta on Modrinth](\($url))",
                "color": 16753920,
                "footer": {"text": "Pre-release — not for production worlds"}
              }]
            }')

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_BETA_WEBHOOK_URL")

          if [[ "$STATUS" -ge 400 ]]; then
            echo "Discord notification failed (HTTP $STATUS) — not failing the build"
          else
            echo "Discord beta notification sent (HTTP $STATUS)"
          fi