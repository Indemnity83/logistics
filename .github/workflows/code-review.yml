name: Code Review

on:
  pull_request:
    branches: ['mc/**']
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    name: review (claude)
    runs-on: ubuntu-latest

    # Deliberately no job-level `if`: a job skipped that way never reports its check,
    # and `review (claude)` is a required context on mc/** — a PR that skipped it
    # would sit pending forever. The job always runs and always reports; the steps
    # below no-op instead. Same shape the check-code.yml suites use for their path
    # filters.
    env:
      # Fork PRs: GitHub resolves secrets to an empty string for pull_request runs
      # from forks, so the action cannot authenticate. Review those by commenting
      # @claude, which runs in the base repo and does get the secret.
      # release-please and dependabot PRs: neither benefits from a code review, and
      # both would spend review budget that human-authored PRs need.
      REVIEWABLE: >-
        ${{ github.event.pull_request.head.repo.full_name == github.repository
        && !contains(github.event.pull_request.labels.*.name, 'autorelease: pending')
        && github.event.pull_request.user.login != 'dependabot[bot]' }}

    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      # Lets the final step publish the `Code Review / summary` commit status.
      statuses: write

    steps:
      - name: Skip review for fork, release, and dependabot pull requests
        if: env.REVIEWABLE != 'true'
        run: echo "Not a reviewable pull request; reporting success without reviewing."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        if: env.REVIEWABLE == 'true'
        with:
          fetch-depth: 1
          # Keep GITHUB_TOKEN out of .git/config: this job reads untrusted PR
          # diffs, and the action supplies its own git credentials anyway.
          persist-credentials: false

      - name: Review pull request
        id: review
        if: env.REVIEWABLE == 'true'
        uses: anthropics/claude-code-action@8251c103ac8c1d761882c86aba1412c7f583c844 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Also mirror the report to the run log, so a run that posts nothing
          # still leaves a trace to diagnose.
          display_report: true
          # Runs the vendored copy of the upstream code-review command, checked
          # out above at .claude/skills/pr-review/. It is that command verbatim
          # apart from one deviation: the step 1 pre-flight no longer stops just
          # because Claude has already commented, so commits pushed to address
          # findings get reviewed too. That override cannot be done from this
          # prompt -- step 1 delegates to a subagent that never sees it (#1038).
          # See the header of SKILL.md before updating either file.
          #
          # Two arguments decide where the review goes, and both are required:
          #
          #   --comment       Without it Claude posts nothing and the findings
          #                   stay in the run log. #1020 dropped it as inert and
          #                   silenced the reviewer for ten PRs.
          #   --allowedTools  The action starts the MCP server that posts inline
          #                   comments only when --allowedTools names that tool,
          #                   even though the skill's frontmatter names it too.
          #                   https://code.claude.com/docs/en/github-actions#run-a-skill
          #
          # Keep claude_args to that one tool. The skill's frontmatter already
          # grants its own `gh` Bash tools, so adding them here is redundant, and
          # widening it (Bash(gh:*) especially) hands `gh api` to a job that reads
          # untrusted PR content -- with an app token carrying contents/workflows
          # write. See the app permission table linked from the docs above.
          prompt: >-
            /pr-review --comment
            ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'

      # The Actions row renders its own "Successful in Nm" from the run
      # duration and carries no settable text — only the app that created a check
      # run may update it, and even then that row shows the duration, not
      # output.title. So the outcome goes on a commit status, the same mechanism
      # CodeRabbit and Codecov use for their notes. A status is always its own
      # row; the context is named to sort directly beneath the Actions row so the
      # two read as a pair.
      #
      # Informational only: it always reports success, and gating stays on the
      # required `review (claude)` context. Never fails the job; a missing note
      # must not turn a finished review red.
      - name: Note the review outcome on a commit status
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
        run: |
          if [ "$REVIEWABLE" != "true" ]; then
            note="Skipped: fork, release, or dependabot pull request"
          elif [ -z "$EXECUTION_FILE" ] || [ ! -f "$EXECUTION_FILE" ]; then
            # No execution file means Claude never ran — almost always because
            # this PR edits the review workflow and fails workflow validation.
            note="Skipped: this pull request modifies the review workflow"
          else
            # Derive the note from what Claude actually posted. Its closing
            # prose is not a summary — it is whatever the model happened to say
            # last, which produced notes like "the 4 review agents are running
            # in the background" on a finished run.
            findings=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/comments" \
              --paginate --jq '[.[] | select(.user.login == "claude[bot]")] | length' 2>/dev/null || echo 0)
            # A clean review posts this exact wording; the same endpoint also
            # carries reviews whose findings went into one summary comment
            # rather than inline, so match the text rather than just counting.
            clean=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --paginate --jq '[.[] | select(.user.login == "claude[bot]")
                | select(.body | test("No issues found"))] | length' 2>/dev/null || echo 0)
            summaries=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --paginate --jq '[.[] | select(.user.login == "claude[bot]")] | length' 2>/dev/null || echo 0)
            if [ "${findings:-0}" -gt 1 ]; then
              note="${findings} findings posted as inline comments"
            elif [ "${findings:-0}" -eq 1 ]; then
              note="1 finding posted as an inline comment"
            elif [ "${clean:-0}" -gt 0 ]; then
              note="No issues found"
            elif [ "${summaries:-0}" -gt 0 ]; then
              note="Findings posted as a summary comment"
            else
              note="No review needed: trivial, or reviewed earlier"
            fi
          fi
          # GitHub truncates status descriptions past 140 characters.
          note=$(printf '%.137s' "$note")
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=success \
            -f context='Code Review / summary' \
            -f description="$note" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            >/dev/null && echo "Posted: $note"
