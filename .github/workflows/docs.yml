name: Docs redirect

# The old Zensical docs site has been retired; GitHub Pages now serves a static
# redirect to the wiki at https://logistics.fandom.com/. Deploys the redirect/ folder.

on:
  push:
    branches:
      - docs
    paths:
      - "redirect/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: redirect
      - uses: actions/deploy-pages@v4
        id: deployment
