plugins {
    id 'multiloader-common'
}

configurations {
    commonJava {
        canBeResolved = true
    }
    commonResources {
        canBeResolved = true
    }
    commonClientJava {
        canBeResolved = true
    }
    commonClientResources {
        canBeResolved = true
    }
    commonGametestJava {
        canBeResolved = true
    }
    commonGametestResources {
        canBeResolved = true
    }
}

dependencies {
    commonJava(project(path: ':common', configuration: 'commonJava'))
    commonResources(project(path: ':common', configuration: 'commonResources'))
    commonClientJava(project(path: ':common', configuration: 'commonClientJava'))
    commonClientResources(project(path: ':common', configuration: 'commonClientResources'))
    commonGametestJava(project(path: ':common', configuration: 'commonGametestJava'))
    commonGametestResources(project(path: ':common', configuration: 'commonGametestResources'))
}

tasks.named('compileJava', JavaCompile) {
    dependsOn configurations.commonJava
    source configurations.commonJava
}

processResources {
    dependsOn configurations.commonResources
    from configurations.commonResources
}

// Wire client sources when splitEnvironmentSourceSets() was called (e.g. fabric).
afterEvaluate {
    if (tasks.findByName('compileClientJava')) {
        tasks.named('compileClientJava', JavaCompile) {
            dependsOn configurations.commonClientJava
            source configurations.commonClientJava
        }
        tasks.named('processClientResources') {
            dependsOn configurations.commonClientResources
            from configurations.commonClientResources
        }
    }
}

// Wire shared GameTest sources into whichever `gametest` source set this loader defines
// (Fabric via fabricApi.configureTests, NeoForge via a manual sourceSets{} block — both end up
// with a task named compileGametestJava/processGametestResources, so this stays generic).
afterEvaluate {
    if (tasks.findByName('compileGametestJava')) {
        tasks.named('compileGametestJava', JavaCompile) {
            dependsOn configurations.commonGametestJava
            source configurations.commonGametestJava
        }
        tasks.named('processGametestResources') {
            dependsOn configurations.commonGametestResources
            from configurations.commonGametestResources
        }
    }
}

tasks.named('sourcesJar', Jar) {
    dependsOn configurations.commonJava
    from configurations.commonJava
    dependsOn configurations.commonResources
    from configurations.commonResources
    dependsOn configurations.commonClientJava
    from configurations.commonClientJava
    dependsOn configurations.commonClientResources
    from configurations.commonClientResources
}
